// KWC 파일 안내 / KWC file guide
// 이 Gradle 파일은 kwc-platform-neoforge/targets/1.21.1/build.gradle 빌드의 plugin/toolchain/dependency/산출물 이름을 정의한다.
// This Gradle file defines plugins, toolchains, dependencies, and artifact naming for kwc-platform-neoforge/targets/1.21.1/build.gradle.
// exact-target JDK/loader pin은 릴리스 호환성 계약이므로 버전 변경 시 build-all 스크립트와 validation matrix를 함께 확인한다.
// Exact-target JDK/loader pins are release compatibility contracts; update build-all scripts and validation matrices together when versions change.

plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.143' }
version='5.3.0'; group='dev.kokoto.webchat'
base { archivesName='KOKOTO-WebChat-5.3.0-NeoForge-1.21.1' }
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
repositories { mavenCentral(); maven { url 'https://repo.bluecolored.de/releases' } }
sourceSets.main.java.srcDirs=['../../src/common/java','../../src/compatEvents/java','../../src/compatClassic/java','../../../kwc-core/src/main/java','../../../kwc-adapter-bluemap/src/main/java','../../../kwc-adapter-squaremap/src/main/java','../../../kwc-adapter-dynmap/src/main/java','../../../kwc-adapter-pl3xmap/src/main/java','../../../kwc-adapter-liveatlas/src/main/java','../../../kwc-adapter-unmined/src/main/java','../../../kwc-adapter-overviewer/src/main/java']
sourceSets.main.resources.srcDirs=['../../../kwc-standalone-frontend/src/main/resources','../../../kwc-adapter-bluemap/src/main/resources','../../../kwc-adapter-squaremap/src/main/resources','../../../kwc-adapter-dynmap/src/main/resources','../../../kwc-adapter-pl3xmap/src/main/resources','../../../kwc-adapter-liveatlas/src/main/resources','../../../kwc-adapter-unmined/src/main/resources','../../../kwc-adapter-overviewer/src/main/resources']
neoForge { version='21.1.248'; mods { kokoto_webchat { sourceSet sourceSets.main } } }
configurations { kwcEmbed }
dependencies {
 implementation 'org.xerial:sqlite-jdbc:3.53.2.0'; kwcEmbed 'org.xerial:sqlite-jdbc:3.53.2.0'
 implementation 'org.yaml:snakeyaml:2.4'; kwcEmbed 'org.yaml:snakeyaml:2.4'
}
def metadata=tasks.register('generateModMetadata',Copy) { from('../../src/common/templates-new'); into(layout.buildDirectory.dir('generated/resources')); expand(neo_version:'21.1.248',minecraft_version:'1.21.1') }
tasks.named('processResources').configure { dependsOn(metadata); from(layout.buildDirectory.dir('generated/resources')); from('../../../kwc-platform-bukkit/src/main/resources') { include 'config.yml'; include 'config-baselines/**'; include 'config-templates/**'; include 'lang/**'; include 'filter-lists-default/**' } }
tasks.withType(JavaCompile).configureEach { options.release=21; options.encoding='UTF-8' }
jar { duplicatesStrategy=DuplicatesStrategy.EXCLUDE; from({ configurations.kwcEmbed.collect { it.isDirectory()?it:zipTree(it) } }); exclude 'META-INF/*.SF','META-INF/*.RSA','META-INF/*.DSA'; from('../../../LICENSE') { rename { 'LICENSE_KOKOTO-WebChat' } } }
tasks.withType(AbstractArchiveTask).configureEach { archiveBaseName.set('KOKOTO-WebChat-5.3.0-NeoForge-1.21.1'); archiveVersion.set('') }
