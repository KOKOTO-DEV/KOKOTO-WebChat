plugins { id 'java'; id 'net.minecraftforge.gradle' version '[5.1,5.2)' }

group='dev.kokoto'
version='5.2.1'
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
repositories { maven { url='https://maven.minecraftforge.net' }; mavenCentral() }
minecraft { mappings channel:'official', version:'1.18.2' }
sourceSets.main.java.srcDirs=['../../src/common/java','../../src/compat118/java','../../../kwc-core/src/main/java','../../../kwc-adapter-bluemap/src/main/java','../../../kwc-adapter-squaremap/src/main/java','../../../kwc-adapter-dynmap/src/main/java','../../../kwc-adapter-liveatlas/src/main/java','../../../kwc-adapter-unmined/src/main/java','../../../kwc-adapter-overviewer/src/main/java']
configurations { kwcEmbed }
sourceSets.main.resources.srcDirs=['../../../kwc-standalone-frontend/src/main/resources','../../../kwc-adapter-bluemap/src/main/resources','../../../kwc-adapter-squaremap/src/main/resources','../../../kwc-adapter-dynmap/src/main/resources','../../../kwc-adapter-liveatlas/src/main/resources','../../../kwc-adapter-unmined/src/main/resources','../../../kwc-adapter-overviewer/src/main/resources','../../../kwc-platform-bukkit/src/main/resources','build/generated/resources']
dependencies {
 minecraft 'net.minecraftforge:forge:1.18.2-40.2.24'
 implementation 'org.xerial:sqlite-jdbc:3.53.2.0'; kwcEmbed 'org.xerial:sqlite-jdbc:3.53.2.0'
 implementation 'org.yaml:snakeyaml:2.4'; kwcEmbed 'org.yaml:snakeyaml:2.4'
}
def metadata=tasks.register('generateModMetadata',Copy) { from('../../src/common/templates'); into(layout.buildDirectory.dir('generated/resources')); expand(minecraft_version:'1.18.2',minecraft_next:'1.19',forge_version:'40.2.24',loader_major:'40') }
processResources.dependsOn(metadata)
tasks.withType(JavaCompile).configureEach { options.release=17; options.encoding='UTF-8' }
jar {
 duplicatesStrategy=DuplicatesStrategy.EXCLUDE
 from({ configurations.kwcEmbed.collect { it.isDirectory()?it:zipTree(it) } })
 exclude 'META-INF/*.SF','META-INF/*.RSA','META-INF/*.DSA'
 archiveFileName="KOKOTO-WebChat-5.2.1-Forge-1.18.2.jar"
 from('../../../LICENSE') { rename { 'LICENSE_KOKOTO-WebChat' } }
}
