plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }

group='dev.kokoto'
version='5.0.0'
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
repositories { maven { url='https://maven.minecraftforge.net' }; mavenCentral() }
jarJar.enable()
minecraft { mappings channel:'official', version:'1.20.2' }
sourceSets.main.java.srcDirs=['../../src/common/java','../../src/compatClassic/java','../../../kwc-core/src/main/java','../../../kwc-adapter-bluemap/src/main/java','../../../kwc-adapter-squaremap/src/main/java','../../../kwc-adapter-dynmap/src/main/java','../../../kwc-adapter-liveatlas/src/main/java','../../../kwc-adapter-unmined/src/main/java','../../../kwc-adapter-overviewer/src/main/java']
sourceSets.main.resources.srcDirs=['../../../kwc-standalone-frontend/src/main/resources','../../../kwc-adapter-bluemap/src/main/resources','../../../kwc-adapter-squaremap/src/main/resources','../../../kwc-adapter-dynmap/src/main/resources','../../../kwc-adapter-liveatlas/src/main/resources','../../../kwc-adapter-unmined/src/main/resources','../../../kwc-adapter-overviewer/src/main/resources','../../../kwc-platform-bukkit/src/main/resources','build/generated/resources']
dependencies { minecraft 'net.minecraftforge:forge:1.20.2-48.1.0';  jarJar(implementation('org.xerial:sqlite-jdbc:3.53.2.0')) { version { strictly '[3.53.2.0]'; prefer '3.53.2.0' } }; jarJar(implementation('org.yaml:snakeyaml:2.4')) { version { strictly '[2.4]'; prefer '2.4' } } }
def metadata=tasks.register('generateModMetadata',Copy) { from('../../src/common/templates'); into(layout.buildDirectory.dir('generated/resources')); expand(minecraft_version:'1.20.2',minecraft_next:'1.21',forge_version:'48.1.0',loader_major:'48') }
processResources.dependsOn(metadata)
tasks.withType(JavaCompile).configureEach { options.release=17; options.encoding='UTF-8' }
tasks.named('jar', Jar).configure {
    archiveFileName = "KOKOTO-WebChat-5.0.0-Forge-1.20.2-slim.jar"
    from('../../../LICENSE') { rename { 'LICENSE_KOKOTO-WebChat' } }
}
tasks.named('jarJar').configure {
    archiveFileName = "KOKOTO-WebChat-5.0.0-Forge-1.20.2.jar"
}
tasks.named('build').configure { dependsOn tasks.named('jarJar') }
