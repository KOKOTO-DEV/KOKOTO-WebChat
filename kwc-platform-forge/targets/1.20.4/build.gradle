// KWC 파일 안내 / KWC file guide
// 이 Gradle 파일은 kwc-platform-forge/targets/1.20.4/build.gradle 빌드의 plugin/toolchain/dependency/산출물 이름을 정의한다.
// This Gradle file defines plugins, toolchains, dependencies, and artifact naming for kwc-platform-forge/targets/1.20.4/build.gradle.
// exact-target JDK/loader pin은 릴리스 호환성 계약이므로 버전 변경 시 build-all 스크립트와 validation matrix를 함께 확인한다.
// Exact-target JDK/loader pins are release compatibility contracts; update build-all scripts and validation matrices together when versions change.

plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }

group='dev.kokoto'
version='5.3.0'
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
repositories { maven { url='https://maven.minecraftforge.net' }; mavenCentral() }
jarJar.enable()
minecraft { mappings channel:'official', version:'1.20.4' }
sourceSets.main.java.srcDirs=['../../src/common/java','../../src/compatClassic/java','../../../kwc-core/src/main/java','../../../kwc-adapter-bluemap/src/main/java','../../../kwc-adapter-squaremap/src/main/java','../../../kwc-adapter-dynmap/src/main/java','../../../kwc-adapter-liveatlas/src/main/java','../../../kwc-adapter-unmined/src/main/java','../../../kwc-adapter-overviewer/src/main/java']
sourceSets.main.resources.srcDirs=['../../../kwc-standalone-frontend/src/main/resources','../../../kwc-adapter-bluemap/src/main/resources','../../../kwc-adapter-squaremap/src/main/resources','../../../kwc-adapter-dynmap/src/main/resources','../../../kwc-adapter-liveatlas/src/main/resources','../../../kwc-adapter-unmined/src/main/resources','../../../kwc-adapter-overviewer/src/main/resources','../../../kwc-platform-bukkit/src/main/resources','build/generated/resources']
dependencies { minecraft 'net.minecraftforge:forge:1.20.4-49.2.9';  jarJar(implementation('org.xerial:sqlite-jdbc:3.53.2.0')) { version { strictly '[3.53.2.0]'; prefer '3.53.2.0' } }; jarJar(implementation('org.yaml:snakeyaml:2.4')) { version { strictly '[2.4]'; prefer '2.4' } } }
def metadata=tasks.register('generateModMetadata',Copy) { from('../../src/common/templates'); into(layout.buildDirectory.dir('generated/resources')); expand(minecraft_version:'1.20.4',minecraft_next:'1.21',forge_version:'49.2.9',loader_major:'49') }
processResources.dependsOn(metadata)
tasks.withType(JavaCompile).configureEach { options.release=17; options.encoding='UTF-8' }
tasks.named('jar', Jar).configure {
    archiveFileName = "KOKOTO-WebChat-5.3.0-Forge-1.20.4-slim.jar"
    from('../../../LICENSE') { rename { 'LICENSE_KOKOTO-WebChat' } }
}
tasks.named('jarJar').configure {
    archiveFileName = "KOKOTO-WebChat-5.3.0-Forge-1.20.4.jar"
}
tasks.named('build').configure { dependsOn tasks.named('jarJar') }
