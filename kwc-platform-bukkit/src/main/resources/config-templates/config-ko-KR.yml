# =============================================================================
# 채팅·메시지·비공개 대화
# =============================================================================

chat:
  # 공개 채팅 기록 저장 backend입니다.
  # sqlite가 권장 영구 backend이고 jsonl은 legacy 단일 파일, memory는 재시작 시 사라집니다.
  # 알 수 없는 값은 sqlite로 정규화됩니다.
  history-storage: "sqlite"
  # 개수 기준으로 보존할 공개 채팅 기록 최대 행 수이며 기간 보존 정책과 함께
  # 적용됩니다.
  # 0은 개수 제한을 없앱니다.
  history-size: 0
  # 공개 채팅 기록의 기간 보존 일수입니다.
  # 0은 기간 기반 만료를 끕니다.
  history-retention-days: 5
  # jsonl backend를 선택했을 때 사용하는 공개 채팅 기록 JSONL 파일명/경로입니다.
  history-file: "history.jsonl"
  # 영구 공개 채팅 기록용 SQLite DB 파일명/경로입니다.
  history-sqlite-file: "history.db"
  # SQLite를 처음 사용할 때 아직 가져오기를 완료하지 않았다면 기존 legacy JSONL 공개
  # 기록을 가져옵니다.
  history-sqlite-migrate-jsonl: true
  # 기록 페이지 한 번에 요청할 기본 메시지 수입니다.
  # 0이면 memory/JSONL 기록에는 명시적 페이지 제한을 두지 않지만 SQLite는 내장 쿼리 안전
  # 상한 500개를 적용합니다.
  history-page-size: 80
  # KWC가 허용하는 일반 공개 채팅 메시지 최대 길이입니다.
  # 0은 이 길이 제한을 없앱니다.
  max-message-length: 120
  # URL이 포함된 공개 채팅 메시지 최대 길이입니다.
  # 양수이면 양수인 일반 메시지 제한보다 작지 않도록 보정됩니다.
  # 0은 이 길이 제한을 없앱니다.
  max-url-message-length: 2048
  # 로그인 웹 사용자의 공개 메시지를 Minecraft로 전달할 형식입니다.
  # placeholder: {player}, {message}.
  web-user-to-game-format: "[Web] {player}: {message}"
  # 게스트 공개 메시지를 Minecraft로 전달할 형식입니다.
  # placeholder: {guest}, {message}.
  web-guest-to-game-format: "[Web Guest] {guest}: {message}"
  # 웹 관리자 공개 메시지를 Minecraft로 전달할 형식입니다.
  # placeholder: {player}, {message}.
  web-admin-to-game-format: "[Web Admin] {player}: {message}"
  # 허용된 웹 발신 공개 메시지를 필요에 따라 송신자를 포함한 연결된 웹 클라이언트에
  # 다시 방송합니다.
  broadcast-web-chat-to-web: true
  # 캡처한 Minecraft 공개 채팅을 연결된 KWC 웹 클라이언트에 방송합니다.
  broadcast-ingame-chat-to-web: true
  # 허용된 KWC 웹 공개 메시지를 Minecraft 채팅으로 전달합니다.
  send-web-chat-to-game: true
  # KWC가 Minecraft에 전달한 채팅에서 URL 부분은 열기 클릭으로 만들고, URL이 아닌 본문은
  # Reply 같은 다른 클릭 동작에 사용할 수 있게 유지합니다.
  clickable-urls-in-game: true
  game-name-hover:
    # 연결된 웹 송신자 이름을 Minecraft 채팅에서 hover할 때 설정한 정보를 표시합니다.
    enabled: false
    # 연결된 웹 송신자 이름에 표시할 Minecraft hover text입니다.
    # 지원 placeholder: {display}, {real}, {uuid}, {source}.
    text: "&f{real}"
message-tokens:
  # newline, blank-line, tab, custom 치환 같은 설정된 메시지 token의 서버측 확장을 켭니다.
  enabled: true
  # 한 메시지에서 수행할 token 치환 최대 횟수로 치환 작업량을 제한합니다.
  # 0은 개수 제한을 없앱니다.
  max-replacements-per-message: 24
  newline:
    # 한 번의 줄바꿈 token으로 인식할 별칭 목록입니다.
    aliases:
      - enter
      - newline
      - nextline
      - linebreak
      - br
  blank-line:
    # 의도적인 빈 줄/문단 구분 token으로 인식할 별칭 목록입니다.
    aliases:
      - blankline
      - emptyline
      - paragraphbreak
  tab:
    # tab/들여쓰기 token으로 인식할 별칭 목록입니다.
    aliases:
      - tab
      - indent
    # tab token을 확장할 때 넣을 공백 수입니다.
    # runtime 범위는 1-16이며 범위를 벗어나면 경계값으로 보정합니다.
    spaces: 4
  # 사용자 정의 token→text 치환 map입니다.
  # key가 token, value가 서버측 치환 문자열이며 빈 map이면 custom 치환을 추가하지 않습니다.
  # 각 항목은 aliases: [name1, name2]를 선택적으로 받고 replacement: "출력할 일반 문자열"은
  # 반드시 문자열로 지정합니다.
  # aliases를 생략하거나 비우면 상위 key를 alias로 사용합니다.
  # 채팅에서는 :alias: 형태로 입력하며, alias는 대소문자를 구분하지 않고 최대 80자이며
  # 콜론/줄바꿈을 포함할 수 없습니다.
  # replacement의 제어문자는 제거되고, 결과가 빈 문자열이면 해당 정의는 무시됩니다.
  # 예:
  # custom:
  #   separator:
  #     aliases:
  #       - separator
  #       - divider
  #     replacement: "────────────"
  #   bullet:
  #     aliases:
  #       - bullet
  #     replacement: "• "
  custom: {}
search:
  # 권한 있는 사용자의 공개 기록 검색 endpoint/UI를 켭니다.
  enabled: true
  # 공개 기록 검색 요청 한 번에 반환할 최대 행 수입니다.
  # runtime 최소값은 1이며 더 작은 값은 최소값으로 보정합니다.
  result-limit: 50
# Announcement 공통 입력 형식:
# enabled: true | false
# message: 따옴표 text/format 문자열; 아래 각 이벤트 설명에 표기된 placeholder만 사용합니다.
announcements:
  # 활성화된 시스템 공지를 웹 공개 채팅에도 전송합니다.
  # false면 게임에만 표시됩니다.
  broadcast-to-web-chat: true
  # 각 이벤트는 enabled + message를 사용합니다. message는 해당 i18n 문구가 없을 때의
  # fallback/custom 문구입니다.
  # 공통: {server}, {event}; 플레이어 이벤트: {player}, {name}, {real_player}, {real_name}, {uuid}, {world}.
  # 이벤트별: death {message}/{killer}, advancement {advancement}/{advancement_key};
  # 월드/게임모드/레벨 변경은 각각 from_/to_ placeholder, 웹 로그인/로그아웃은 {name}/{player}를
  # 사용합니다.

  minecraft-join:
    enabled: true
    message: "🟢 {player} joined the server."
  minecraft-quit:
    enabled: true
    message: "🔴 {player} left the server."
  first-join:
    enabled: true
    message: "✨ {player} joined the server for the first time."
  death:
    enabled: true
    message: "☠ {message}"
  advancement:
    enabled: true
    message: "🏆 {player} completed the advancement [{advancement}]."
  server-start:
    enabled: true
    message: "🟢 Server started."
  server-stop:
    enabled: true
    message: "🔴 Server is stopping."

  world-change:
    enabled: false
    message: "🌍 {player} moved to {to_world}."
  gamemode-change:
    enabled: false
    message: "🎮 {player} changed game mode to {to_gamemode}."
  level-change:
    enabled: false
    message: "⭐ {player} changed level from {old_level} to {new_level}."
  bed-enter:
    enabled: false
    message: "💤 {player} entered a bed."
  web-login:
    enabled: false
    message: "🌐 {name} logged in to web chat."
  web-logout:
    enabled: false
    message: "🌐 {name} logged out of web chat."

reply:
  game-click:
    # Minecraft 채팅의 대상 메시지 본문을 클릭해 /kchat reply 대상을 준비할 수 있게 하며 URL
    # 부분은 링크 열기 동작을 유지합니다.
    enabled: true
    # KWC 발신 메시지뿐 아니라 로컬에서 캡처한 Minecraft 공개 채팅에도 Reply 클릭 동작을
    # 추가합니다.
    # 다른 채팅 포맷 플러그인과 click event가 충돌하면 끕니다.
    local-game-chat: true
  # 공개 채팅 Reply 대상에 사용하는 Minecraft component text입니다.
  # placeholder: {player}, {message}.
  game-command-format: "&8[&dReply&8] &f{player}&7: &f{message}"
  game-preview:
    # Reply를 Minecraft에 표시할 때 원문을 짧은 인용 미리보기로 표시합니다.
    enabled: true
    # Minecraft Reply 인용 미리보기 형식입니다.
    # placeholder: {sender}, {preview}.
    format: "&7{sender}: {preview}"
    # Minecraft Reply 인용 미리보기에 표시할 원문 최대 길이입니다.
    # 0은 미리보기 길이 자르기를 하지 않습니다.
    max-length: 120
  game-prefix:
    # 이전 메시지를 참조하는 Reply를 Minecraft에 표시할 때 설정한 Reply 표식을 앞에
    # 붙입니다.
    enabled: true
    # Reply metadata가 있는 Minecraft 메시지 앞에 붙일 prefix text입니다.
    text: "↪ [Reply] "
pinned:
  # 공개 채팅 pin/unpin 저장 기능과 고정 메시지 UI를 켭니다.
  enabled: true
  # 동시에 고정 상태로 유지할 수 있는 공개 메시지 최대 개수입니다.
  # 0은 개수 제한을 없앱니다.
  max-pins: 20
  # 로그인하지 않은/게스트 열람자도 고정 메시지 영역을 볼 수 있게 합니다.
  # pin 관리는 기존 권한 검사를 그대로 요구합니다.
  show-to-logged-out: true
  # 고정 메시지가 참조하는 파일을 보존 참조로 취급해 일반 미참조 업로드 정리에서
  # 삭제되지 않게 합니다.
  preserve-uploads: true
direct-message:
  # 저장형 1:1 DM입니다. 비공개 메시지 본문을 저장하므로 기본값은 false입니다.
  # 타 서버 게임 대상: /kchat dm <player>@<server-id> <message>; 먼저 server-relay를 설정합니다.
  enabled: false
  # DM 저장 backend입니다.
  # auto는 호환되는 영구 backend를 선택하며 설정된 기록 backend가 legacy JSONL 경로를 요구하는
  # 경우를 제외하면 SQLite를 우선합니다.
  # sqlite/jsonl을 명시할 수도 있습니다.
  storage: "auto"
  # 저장된 DM 메시지의 기간 보존 일수입니다.
  # 0은 기간 기반 만료를 끕니다.
  retention-days: 0
  # 각 DM thread에서 개수 기준으로 보존할 최대 메시지 수입니다.
  # 0은 개수 제한을 없앱니다.
  max-messages-per-thread: 0
  # 웹/게임에서 전송할 수 있는 DM 메시지 최대 길이입니다.
  # 0은 이 길이 제한을 없앱니다.
  max-message-length: 500
  # 인증된 KWC 웹 사용자가 DM을 보낼 수 있게 합니다.
  allow-web-send: true
  # 필요한 KWC 권한이 있는 Minecraft 플레이어가 KWC 게임 명령/click 동작으로 DM을 보낼 수
  # 있게 합니다.
  allow-game-send: true
  # 지원되는 Minecraft 귓속말 명령을 송신자/대상을 확인할 수 있을 때 KWC DM 기록/대화로
  # 캡처합니다.
  capture-game-whispers: true
  # 선택적 관리자 DM 본문 감사 기능입니다. 기본값은 꺼짐입니다.
  # 이 기능을 켜도 private-chat-super-admins에 정확히 지정된 계정만 접근할 수 있습니다.
  # 감사 화면은 읽기 전용이며 전송, 답글, 숨김, 읽음 처리를 할 수 없습니다.
  # 각 페이지 열람은 본문을 복사하지 않고 감사 로그에 기록됩니다.
  admin-audit:
    enabled: false
  # 연결된 사용자가 로그인할 때 대기/미확인 DM 알림 상태를 표시합니다.
  notify-on-login: true
  # 새 비공개 메시지가 도착할 때 DM 알림 업데이트를 생성합니다.
  notify-on-message: true
  # 웹 UI에 미확인 DM 개수/badge를 표시합니다.
  web-unread-badge: true
  # 현재 사용자의 대화 목록에서 DM 대화를 숨길 때 확인을 요구합니다.
  confirm-hide: true
  # jsonl backend 선택 시 사용하는 legacy DM JSONL 저장 파일입니다.
  jsonl-file: "direct-messages.jsonl"
  # Reply metadata를 포함한 영구 DM 저장에 사용하는 SQLite DB 파일입니다.
  sqlite-file: "direct-messages.db"
group-chat:
  # 저장형 다중 사용자 채팅방입니다.
  # 비공개 메시지 본문을 저장하므로 기본값은 false입니다.
  enabled: false
  # 인증된 KWC 웹 사용자가 현재 소속된 그룹 방에 메시지를 보낼 수 있게 합니다.
  allow-web-send: true
  # 일반 방 규칙 아래에서 비공개 초대가 없어도 찾거나 참여할 수 있는 public 그룹 방을
  # 허용합니다.
  allow-public-rooms: true
  # 그룹 방에서 멤버십/초대 제어와 함께 방 비밀번호를 사용할 수 있게 합니다.
  allow-room-passwords: true
  # 현재 사용자가 그룹 방을 나가기 전에 확인을 요구합니다.
  confirm-leave: true
  # 현재 사용자의 대화 목록에서 그룹 방을 숨기기 전에 확인을 요구합니다.
  confirm-hide: true
  admin-audit:
    # 권한 있는 관리자의 그룹 방 기록 감사 조회를 허용하며 일반 사용자에게는 기존 방
    # 멤버십 검사를 유지합니다.
    enabled: false
  # 저장된 그룹 방 메시지의 기간 보존 일수입니다.
  # 0은 기간 기반 만료를 끕니다.
  retention-days: 30
  # 각 그룹 방에서 개수 기준으로 보존할 최대 메시지 수입니다.
  # 0은 개수 제한을 없앱니다.
  max-messages-per-room: 1000
  # 그룹 방에서 허용하는 메시지 최대 길이입니다.
  # 0은 이 길이 제한을 없앱니다.
  max-message-length: 500
  # 방 관리 검사에서 사용자 한 명이 소유/참여할 수 있는 그룹 방 최대 개수입니다.
  # 0은 개수 제한을 없앱니다.
  max-rooms-per-user: 20
  # 그룹 방 하나에 허용할 최대 멤버 수입니다.
  # 0은 개수 제한을 없앱니다.
  max-members-per-room: 50
  # 그룹 방 이름의 최대 길이입니다.
  # runtime 최소값은 1이며 더 작은 값은 최소값으로 보정합니다.
  max-room-name-length: 32
  # 그룹 방 초대 유효시간(시간)입니다.
  # 0은 무제한이 아닙니다.
  # runtime 최소값은 1이며 더 작은 값은 최소값으로 보정합니다.
  invite-expire-hours: 72
  # 그룹 방, 멤버십, 초대, 메시지와 비공개 Reply metadata 저장에 사용하는 SQLite DB입니다.
  sqlite-file: "group-messages.db"
# 서버 간 공개 채팅 및 1:1 DM Relay 설정입니다.
server-relay:
  # 참여 서버의 group/peer 설정을 모두 맞춘 뒤 켭니다.
  enabled: false
  # 이 서버의 고유 ID입니다. 소문자 a-z, 0-9, 점, 밑줄, 하이픈을 사용합니다.
  server-id: "server-1"
  # 이 서버에서 온 메시지에 표시할 이름입니다.
  server-name: "Server 1"
  # peer 연결 timeout(초). 최소 1.
  connect-timeout-seconds: 5
  # Relay 요청 timeout(초). 최소 1.
  request-timeout-seconds: 10
  # Relay 요청에서 허용할 시계 차이(초). 최소 1.
  max-clock-skew-seconds: 60
  # 중복/replay ID 보존 시간(초). 최소 30.
  dedupe-seconds: 300
  # 최대 forwarding hop 수. 범위 1-32.
  max-hops: 8

  # Relay로 보낼 로컬 공개 메시지 출처입니다.
  sources:
    game: true
    web: true
    guest: true
    # Discord 연동으로 Relay loop가 생길 수 있으면 false로 둡니다.
    discord: false
    # 로컬 system/announcement 메시지도 Relay합니다.
    system: false

  # 받은 공개 Relay 메시지를 표시할 위치입니다. DM은 별도로 처리됩니다.
  delivery:
    web: true
    game: true

  # 사용 가능: {server}, {server_id}, {source}, {sender}, {real_sender}, {uuid}, {role}, {message}
  game-format: "&8[&b{server}&8] &f{sender}&7: &f{message}"

  # groups와 peers는 YAML 목록이며 각 항목은 반드시 "- id:"로 시작합니다.
  # 처음 설정할 때 한 서버에서 shared-secret: ""로 둔 뒤 reload/재시작합니다.
  # 생성된 값을 같은 group의 모든 서버에 복사합니다.
  # 각 서버는 같은 group id와 secret으로 상대 서버를 peer에 등록합니다.
  # peer url에는 상대 서버의 KWC API 기본 URL을 넣습니다. 예: https://server2.example.com/api
  # http:// peer는 경고와 함께 직접 Relay에는 사용할 수 있습니다.
  # 단, forwarding 경로로는 사용되지 않습니다.
  # 예:
  # groups:
  #   - id: "main"
  #     shared-secret: ""
  #     forwarding:
  #       enabled: false
  #     peers:
  #       - id: "server-2"
  #         url: "https://server2.example.com/api"
  #         enabled: true
  groups: []
player-display:
  # KWC가 표시할 플레이어 이름 기준입니다.
  # name=Minecraft 계정명, display-name=서버 display name, custom-name=저장된 custom name이며 잘못된 값은
  # name으로 fallback합니다.
  mode: "name"
  # 플레이어 표시 이름을 웹/plain-text 환경에 노출하기 전에 Minecraft formatting/color code를
  # 제거합니다.
  strip-colors: true

# =============================================================================
# 계정·보안·관리
# =============================================================================

guest:
  # 로그인하지 않은 브라우저 방문자가 guest/captcha/rate-limit 규칙에 따라 게스트 공개
  # 채팅을 사용할 수 있게 합니다.
  enabled: true
  # 게스트 사용자가 항상 자동 생성 이름만 쓰지 않고 게스트 표시 이름을 직접 정할 수
  # 있게 합니다.
  allow-custom-name: true
  # KWC가 게스트 이름을 자동 생성할 때 붙이는 prefix입니다.
  name-prefix: "Guest-"
  # 같은 resolved client identity/IP에서 게스트 메시지를 연속 전송할 때 요구하는 최소
  # 간격(초)입니다.
  # 0은 이 cooldown 제한 요소를 끕니다.
  cooldown-seconds: 6
  # 같은 resolved client identity/IP에 적용하는 분당 게스트 메시지 제한입니다.
  # 0은 이 분당 제한 요소를 끕니다.
  max-messages-per-minute: 50
  # KWC 게스트 이름 검사에서 알려진 Minecraft 플레이어 이름을 사칭하는 게스트 이름을
  # 거부합니다.
  block-player-name-spoofing: true
  # 관리자/서버를 사칭하기 쉬운 이름을 보호하기 위한 추가 게스트 예약 이름 목록이며
  # 대소문자를 구분하지 않고 비교합니다.
  blocked-names:
    - "admin"
    - "administrator"
    - "server"
    - "op"
    - "console"
    - "moderator"
    - "owner"
captcha:
  # 게스트 captcha 방식입니다.
  # 내장 산술 captcha는 math일 때만 활성화되며 off를 포함한 non-math 값은 captcha 검사를
  # 끕니다.
  mode: "math"
  # 발급한 captcha 문제의 유효시간(초)입니다.
  # 이 값은 clamp하지 않으므로 0/음수는 새 문제를 즉시 또는 사실상 즉시 만료시킵니다.
  expire-seconds: 120
  # 유효한 captcha 통과 상태를 재사용하지 않고 게스트 메시지마다 새 captcha 통과를
  # 요구합니다.
  require-on-each-message: false
  # 메시지마다 captcha를 요구하지 않을 때 한 번 성공한 captcha 상태를 재사용할 수 있는
  # 시간(분)입니다.
  # runtime 최소값은 1이며 더 작은 값은 최소값으로 보정합니다.
  pass-valid-minutes: 120
auth:
  # 계정/로그인 설정 확인용 선택적 사용 예:
  # - 웹 계정 연결: 웹 UI에서 code를 발급받은 뒤 Minecraft에서 /kchat auth <code>를 실행합니다.
  # - 비밀번호 로그인: 연결된 계정 비밀번호는 /kchat password <newPassword>로 설정/변경합니다.
  # - /kchat status로 현재 연결 상태를 확인합니다. auto-admin-from-permission은 설정한 permission을
  #   가진 연결 플레이어를 자동 승격할 수 있습니다.
  # 비밀번호는 hash로 저장되지만 HTTP로 외부 공개하면 로그인 트래픽 자체는 평문입니다.
  # 신뢰할 수 없는/공개 네트워크에서는 HTTPS를 사용하십시오.
  # Minecraft 계정 연동과 인증된 KWC 웹 세션 기능을 켭니다.
  enabled: true
  # 게임 계정 연동 코드로 생성할 문자/숫자 길이입니다.
  # runtime 최소값은 4이며 더 작은 값은 최소값으로 보정합니다.
  link-code-length: 6
  # 새로 발급한 계정 연동 코드의 유효시간(초)입니다.
  # runtime 최소값은 30이며 더 작은 값은 최소값으로 보정합니다.
  link-code-expire-seconds: 180
  # 같은 client/user가 계정 연동 코드 발급을 반복할 때 요구하는 최소 간격(초)입니다.
  # 0은 이 제한 요소를 끕니다.
  link-code-cooldown-seconds: 3
  # 발급 rate limiter에서 분당 허용할 계정 연동 코드 최대 발급 횟수입니다.
  # 0은 이 제한 요소를 끕니다.
  link-code-max-per-minute: 10
  # 연결된 계정이 link-code 설정 이후 KWC 비밀번호로 웹 채팅에 로그인할 수 있게 합니다.
  password-login: true
  # 일반 USER/MODERATOR 웹 세션의 만료 기간(일)입니다.
  # 0 이하는 expiry timestamp를 두지 않습니다.
  remember-session-days: 30
  # 현재 auth.admin-permission을 가진 연결 Minecraft 계정에 KWC ADMIN 역할을 자동 부여/매핑합니다.
  auto-admin-from-permission: true
  # KWC 관리자 역할 자동 매핑에 사용하는 Minecraft permission node입니다.
  admin-permission: "kwc.admin"
security:
  # 설정된 실패 집계 구간 안에서 IP 기반 임시 잠금을 발생시키는 로그인 실패
  # 횟수입니다.
  # 0은 이 제한 요소를 끕니다.
  login-fail-limit: 5
  # 로그인 잠금 판정용 실패 횟수를 집계하는 rolling window(초)입니다.
  # runtime 최소값은 1이며 더 작은 값은 최소값으로 보정합니다.
  login-fail-window-seconds: 300
  # 로그인 실패 제한을 넘은 뒤 IP 기반 로그인 잠금을 유지할 시간(초)입니다.
  # 0은 이 제한 요소를 끕니다.
  login-lock-seconds: 600
  # resolved client IP 하나당 허용할 동시 /stream SSE 연결 최대 개수입니다.
  # 리버스 프록시 사용 시 모든 client가 proxy IP로 보이지 않도록 http.
  # trusted-proxies를 정확히 설정합니다.
  # 0은 이 제한 요소를 끕니다.
  max-sse-connections-per-ip: 10
  # KWC 서버 전체에서 허용할 동시 /stream SSE 연결 최대 개수입니다.
  # 0은 이 제한 요소를 끕니다.
  max-sse-connections-total: 500
admin:
  # Minecraft UUID와 연결되지 않은 KWC 로컬 웹 관리자 계정을 허용합니다.
  allow-local-admin-accounts: true
  # ADMIN 웹 세션의 만료 기간(시간)입니다.
  # 0 이하는 관리자 세션에 expiry timestamp를 두지 않습니다.
  admin-session-expire-hours: 12
  # 관리자 로그인에 적용할 선택적 IP/CIDR allowlist입니다.
  # 빈 목록은 IP 제한이 없으며 trusted proxy 설정과 함께 resolved client IP를 기준으로
  # 사용합니다.
  # [] = 관리자 로그인 IP 제한 없음. 예: ["127.0.0.1", "10.0.0.0/8", "2001:db8::/32"]
  # 매처는 "*"를 모든 주소로 처리합니다. 제한하지 않을 의도라면 []를 쓰고, 제한하려면
  # 구체적인 IP/CIDR만 지정하십시오.
  # 설정 예시 (allow-admin-login-from: [] 한 줄을 아래 블록으로 교체):
  # allow-admin-login-from:
  #   - "127.0.0.1"
  #   - "10.0.0.0/8"
  #   - "2001:db8::/32"
  allow-admin-login-from: []
# 비공개 채팅의 관리/용량 확인용 메타데이터 권한을 추가로 부여할 KWC 계정 식별자
# 목록입니다.
# 빈 목록은 추가 대상을 만들지 않으며 기존 ADMIN/audit 규칙은 그대로 적용됩니다.
# [] = 추가 private-chat super-admin 권한 대상 없음.
# 이 목록만으로는 본문을 열 수 없습니다. DM 본문은 direct-message.admin-audit.enabled,
# 그룹채팅 본문은 group-chat.admin-audit.enabled를 함께 켜야 읽기 전용 감사가 가능합니다.
# 두 감사 화면의 페이지 열람은 본문을 복사하지 않고 audit log에 기록됩니다.
# 예: ["00000000-0000-0000-0000-000000000000", "AdminName"]
# 설정 예시 (private-chat-super-admins: [] 한 줄을 아래 블록으로 교체):
# private-chat-super-admins:
#   - "00000000-0000-0000-0000-000000000000"
#   - "AdminName"
private-chat-super-admins: []
audit:
  # 지원되는 관리/보안 동작에 대한 KWC audit logging을 켭니다.
  enabled: true
  # KWC audit log 파일을 저장할 data directory 기준 상대 폴더입니다.
  directory: "audit"
moderation:
  # KWC moderation 서비스 마스터 스위치입니다.
  # config 전용이며 Web Admin에 의도적으로 노출하지 않습니다.
  enabled: true
  # moderation이 활성일 때 Web Admin panel의 moderation 기능을 허용합니다.
  # 이 정책 스위치는 config 전용입니다.
  allow-web-admin-panel: true
  # MODERATOR 역할 사용자가 다른 권한 조건을 만족할 때 moderation API로 메시지를 삭제할 수
  # 있게 합니다.
  # 이 정책 스위치는 config 전용입니다.
  allow-moderator-message-delete: true
  # MODERATOR 역할 사용자가 moderation 제어로 guest/IP mute/unmute를 수행할 수 있게 합니다.
  # 이 정책 스위치는 config 전용입니다.
  allow-moderator-guest-mute: true
  # 기간을 생략한 mute의 기본 시간(분)입니다.
  # 0 이하는 영구 mute이며 config 전용 설정입니다.
  default-mute-minutes: 60
content-filter:
  # Content Filter 운영 가이드:
  # - scopes.public / group / dm에서 검사할 대화 종류를 선택합니다.
  #   DM 필터는 개인정보 특성 때문에 기본 off입니다.
  # - 아래 rules는 config.yml 안의 inline rule이고, filter-lists는 filter-lists 디렉터리의 큰 UTF-8
  #   단어 목록을 읽습니다. 두 소스 모두 같은 엔진을 사용합니다.
  # - action=block은 메시지를 거부하고, mask는 매칭 text를 가리며, replace는 설정된
  #   replacement/mapping으로 바꿉니다.
  # - 권장 순서: rule/list를 먼저 작성·시험하고 필요한 scope를 정한 뒤 content-filter.enabled를
  #   켭니다. anti-evasion을 넓힐수록 오탐 가능성도 커지므로 의도적으로 조정하십시오.
  # content-filter.rules 바로 위에 실제 inline replace rule 예제가 있습니다.
  # KWC 공통 content-filter engine의 마스터 스위치입니다.
  # 끄면 설정된 rule/list를 채팅 내용에 적용하지 않습니다.
  enabled: false
  scopes:
    # content filter를 공개 채팅 입력 경로에 적용합니다.
    public: true
    # content filter를 그룹 방 메시지 입력 경로에 적용합니다.
    group: true
    # content filter를 비공개 DM 입력 경로에 적용합니다.
    # 기본값은 off라서 private-chat filtering은 명시적으로 켜야 합니다.
    dm: false
  block:
    # 내용을 차단할 때 단순 차단 안내만 보내지 않고 허용된 사용자/관리자 피드백에
    # 매칭 단어/rule 정보를 포함합니다.
    show-matched-word: true
  mask:
    # 전체 메시지를 차단하지 않고 매칭 부분을 mask하는 content-filter rule에서 사용할 치환
    # text입니다.
    text: "***"
  anti-evasion:
    # 필터 매칭 전에 Unicode 형식을 정규화해 시각/호환상 비슷한 문자로 rule을 우회하기
    # 어렵게 합니다.
    unicode-normalization: true
    # filter engine 규칙에 따라 무시 가능한 구분/공백을 제거한 compact 형태도 매칭해 단어
    # 쪼개기 우회를 잡습니다.
    compact-match: true
    # 금칙어 사이에 다른 문자를 끼워 넣은 경우도 설정된 gap 정책에 따라 검출하는
    # interleave 매칭을 켭니다.
    interleave-match: true
    # 제한형 interleave 매칭에서 연속 문자 사이에 허용할 삽입 문자 최대 gap입니다.
    interleave-max-gap: 2
    # 켜면 interleave gap 상한을 없앱니다.
    # 넓은 간격 매칭은 오탐/처리량 위험을 늘릴 수 있으므로 주의해서 사용합니다.
    interleave-unlimited-gap: false
    # 비교 전에 과도한 반복 문자를 줄여 반복 글자 방식의 우회를 rule과 매칭할 수 있게
    # 합니다.
    collapse-repeats: false
    # collapse-repeats 사용 시 한 문자 반복에서 남길 최대 연속 수입니다.
    # runtime 최소값은 1이며 더 작은 값은 최소값으로 보정합니다.
    repeat-limit: 1
  # inline content-filter rule 목록입니다.
  # 각 rule은 매칭 단어/mode/action을 정의하며 filter-lists 디렉터리에서 활성화한 UTF-8 목록과
  # 함께 적용됩니다.
  # Rule 필드: id(선택, [a-z0-9._-]로 정규화, 최대 64자), enabled(true|false, 기본 true),
  # action(block|mask|replace), words(문자열 목록).
  # action=replace일 때 replacements는 문자열 목록, replacement-mode는 first|random(기본 first), mappings는
  # 선택적인 word -> replacement YAML map입니다. mappings의 key도 자동으로 match word에 포함됩니다.
  # 예:
  # rules:
  #   - id: "example-replace"
  #     enabled: true
  #     action: "replace"
  #     words:
  #       - "word1"
  #       - "word2"
  #     replacements:
  #       - "부드러운 표현"
  #       - "다른 표현"
  #     replacement-mode: "first"
  #     mappings:
  #       "word2": "지정 표현"
  rules: []
commands:
  # KWC 웹 UI에서 허용된 Minecraft/server 명령을 실행하는 기능의 마스터 스위치입니다.
  enabled: false
  # role/확인 검사를 통과한 뒤 설정 preset에 한정하지 않고 임의 command text 실행을
  # 허용합니다.
  # 신뢰하는 관리자 환경에서만 켭니다.
  allow-all: false
  # 웹 명령 실행에 필요한 최소 인증 KWC role입니다.
  # 지원 role: USER, MODERATOR, ADMIN.
  min-role: "ADMIN"
  # 현재 사용자에게 웹 명령 실행이 허용될 때 command 실행 버튼/제어를 표시합니다.
  show-button: true
  # 일반 채팅 입력창의 slash 시작 text를 채팅으로 보내지 않고 웹 command 실행 flow로 보낼 수
  # 있게 합니다.
  run-from-chat-input: false
  # 일반 채팅 입력이 /로 시작할 때 command 관련 UI 안내/제어를 표시합니다.
  show-when-input-starts-with-slash: true
  # 웹에서 요청한 command를 실제 실행하기 전에 명시적 확인 단계를 요구합니다.
  require-confirm: true
  # 웹 command 실행에서 허용할 command text 최대 길이입니다.
  # 0은 이 길이 제한을 없앱니다.
  max-length: 0
  # true = 웹 명령 실행 안내를 공개 웹 채팅과 현재 온라인 게임 플레이어에게 표시합니다.
  # false = 명령 응답/제어 및 기존 콘솔·감사 로그 경로에서만 처리합니다.
  broadcast-result-to-web-chat: false
  # 웹 command UI에 표시/허용할 선택적 preset 정의입니다.
  # null/empty이면 preset이 없으며 임의 command 허용 여부는 commands.
  # allow-all에 따릅니다.
  # Preset 필드: id(선택; [a-z0-9._-]로 정규화, 최대 64자), label(선택), description(선택),
  # command(필수), enabled(true|false, 기본 true), confirm(true|false, 기본 true).
  # command 앞의 /는 제거되며 줄바꿈/CR/NUL을 포함한 command는 무시됩니다.
  # 실제 예시(아래 presets: 줄 아래에 주석 해제하여 사용):
  # - id: "day"
  #   label: "낮으로 변경"
  #   description: "현재 월드 시간을 낮으로 변경합니다."
  #   command: "time set day"
  #   confirm: true
  # - id: "weather-clear"
  #   label: "맑은 날씨"
  #   command: "weather clear"
  #   confirm: true
  presets:

# =============================================================================
# 웹 UI·알림
# =============================================================================

ui:
  # 기본 웹 UI 언어이자 config/reference/migration 주석 표현 언어 선택 기준입니다.
  # 내장 지원: en-US, ko-KR, ja-JP, zh-CN이며 custom UI 언어는 영어 config 표현을 사용합니다.
  language: "en-US"
  # 선택한 UI 언어에 번역 key가 없을 때 사용할 웹 번역 fallback 언어입니다.
  # 내장 지원: en-US, ko-KR, ja-JP, zh-CN.
  language-fallback: "en-US"
  # 웹 채팅 timestamp에 사용할 timezone입니다.
  # local은 브라우저/기기 timezone을 사용하고 UTC, Asia/Seoul 같은 유효 Java/IANA zone id를
  # 허용하며 잘못된 값은 local로
  # fallback합니다.
  time-zone: "local"
  # 기본 웹 theme입니다.
  # 지원값: system, dark, light, high-contrast.
  # 사용자 설정 제어가 켜져 있으면 개인 preference가 이를 덮어쓸 수 있습니다.
  theme: "system"
  # KWC가 BlueMap에 임베드됐을 때 지원되는 범위에서 독립 theme 대신 BlueMap의 light/dark theme
  # 신호를 따릅니다.
  sync-bluemap-theme: true
  # KWC 웹 surface에 적용할 기본 불투명도입니다.
  # runtime 범위는 0.2-1.0이며 범위를 벗어나면 경계값으로 보정합니다.
  opacity: 0.92
  # 안전하게 렌더링된 웹 채팅 본문에서 인식한 URL text를 클릭 가능한 링크로 변환합니다.
  linkify-urls: true
  # 지원되는 이미지 URL/업로드를 웹 채팅에서 inline 이미지 미리보기로 표시합니다.
  image-preview-enabled: true
  # 한 메시지에서 렌더링할 inline 이미지 미리보기 최대 개수입니다.
  # 0은 개수 제한을 없앱니다.
  image-preview-max-per-message: 3
  # 이미지 미리보기에 설정할 높이 상한(px)입니다.
  # 양수여도 채팅 viewport 안전 상한이 함께 적용되며, 0은 이 명시적 px 상한만 없애고 자동
  # viewport 상한을 사용하므로 완전 무제한이 아닙니다.
  image-preview-max-height: 720
  # 지원되는 Google Drive 공유 링크를 웹 채팅 이미지 미리보기 후보로 인식합니다.
  google-drive-image-preview: false
  # Google Drive preview URL 방식입니다.
  # uc는 uc-style 경로를 유지하고 그 외 값은 thumbnail로 정규화됩니다.
  google-drive-preview-mode: "thumbnail"
  # guest chat이 꺼져 있을 때 로그인하지 않은 방문자에게 동작하지 않는 guest 입력창을
  # 보여주지 않고 공개 채팅 UI를 숨깁니다.
  hide-chat-for-guests-when-guest-disabled: true
  # 호스트 layout이 지원하는 환경에서 사용자가 floating/embedded KWC 채팅 panel 크기를 조절할
  # 수 있게 합니다.
  resizable: true
  # 사용자가 마지막으로 조절한 KWC panel 크기를 브라우저 측 preference에 저장/복원합니다.
  remember-window-size: true
  # 기억된/사용자별 크기를 적용하기 전 KWC panel 기본 너비(px)입니다.
  default-width: 372
  # 기억된/사용자별 크기를 적용하기 전 KWC panel 기본 높이(px)입니다.
  default-height: 462
  # 사용자가 조절할 수 있는 KWC panel 최소 너비(px)입니다.
  min-width: 280
  # 사용자가 조절할 수 있는 KWC panel 최소 높이(px)입니다.
  min-height: 240
  # 설정상 KWC panel 최대 너비(px)입니다.
  # 0은 설정상 최대값만 없애며 브라우저/viewport 제약은 계속 적용될 수 있습니다.
  max-width: 640
  # 설정상 KWC panel 최대 높이(px)입니다.
  # 0은 설정상 최대값만 없애며 브라우저/viewport 제약은 계속 적용될 수 있습니다.
  max-height: 720
  # 더 구체적인 font-size 설정이 없는 웹 UI 요소에 적용할 기본 글자 크기(px)입니다.
  font-size: 13
  # 웹 채팅 메시지 본문의 글자 크기(px)입니다.
  message-font-size: 13
  # 채팅 입력창/composer의 글자 크기(px)입니다.
  input-font-size: 13
  # 채팅 메시지 text color 선택적 override입니다.
  # 빈 값은 활성 theme를 따릅니다.
  text-color: ""
  # 일반 UI/control text color 선택적 override입니다.
  # 빈 값은 활성 theme를 따릅니다.
  ui-text-color: ""
  # 웹 UI text-shadow preset입니다.
  # 지원값: none, auto, dark, light, custom이며 잘못된 값은 auto로 정규화됩니다.
  text-shadow-mode: "auto"
  # custom mode에서만 사용할 CSS text-shadow 값입니다.
  # KWC가 sanitize하고 길이/허용 문자 범위를 제한하며 url(...) 내용은 거부합니다.
  text-shadow-custom: "0 1px 2px rgba(0, 0, 0, 0.85)"
  # 채팅 입력창/composer 배경색 선택적 override입니다.
  # 빈 값은 활성 theme를 따릅니다.
  input-background-color: ""
  # KWC button 및 작은 control에 사용할 글자 크기(px)입니다.
  button-font-size: 12
  # 미확인/status badge에 사용할 글자 크기(px)입니다.
  badge-font-size: 10
  # KWC 기본 CSS font-family입니다.
  # 빈 값은 내장 browser/system stack을 사용하며 local font 이름은 Minecraft 서버가 아니라 각
  # 사용자 기기에서 해석됩니다.
  font-family: ""
  # 사용자가 Chat settings UI에서 지원되는 브라우저별/계정별 채팅 외형·동작 preference를
  # 바꿀 수 있게 합니다.
  user-preferences-control: true
  user-profiles:
    # 인증 사용자의 이름 있는 서버 저장 preference profile 기능을 켭니다.
    enabled: true
    # 계정당 서버에 저장할 preference profile 최대 개수입니다.
    # runtime 범위는 0-20이며 범위를 벗어나면 경계값으로 보정합니다.
    # 0은 서버 저장 프로필 기능을 끕니다.
    max-profiles: 5
    # preference profile JSON 내보내기/가져오기를 허용합니다.
    # 가져온 데이터는 strict schema로 검증되고 값은 지원 범위 안이어야 합니다.
    allow-import-export: true
  picture-in-picture:
    # 브라우저가 필요한 기능을 제공할 때 지원되는 KWC picture-in-picture/floating view 동작을
    # 켭니다.
    enabled: false
  # Chat settings에 표시할 font-family 선택 목록입니다.
  # 빈 문자열은 browser/system 기본값이며 지원 환경에서는 설치된 local font 이름을 직접
  # 입력할 수도 있습니다.
  user-font-options:
    - ""
    - "system-ui, sans-serif"
    - "Arial, sans-serif"
    - "Verdana, sans-serif"
    - "Georgia, serif"
    - "monospace"
  virtual-scroll:
    # 긴 채팅 기록에서 DOM에 제한된 가시 범위만 유지하도록 virtualized message rendering을
    # 켭니다.
    enabled: true
    # virtual-scroll 가시 범위 위/아래에 추가로 렌더링할 viewport screen 거리입니다.
    # 0도 유효한 최소 동작값입니다.
    overscan-screens: 0.75
    # viewport 계산상 더 적게 필요해도 렌더 상태로 유지할 최소 메시지 행 수입니다.
    # 0도 유효한 최소 동작값입니다.
    min-rendered-messages: 30
  history-preload:
    # 상단/하단에서 몇 viewport screen 거리일 때 추가 기록 preload를 시작할지 정합니다.
    # runtime 범위는 0-5이며 범위를 벗어나면 경계값으로 보정합니다.
    screens: 0.70
    # history-preload screen 거리와 함께 쓰는 최소 pixel threshold로 정확한 끝에 닿기 전에 기록
    # 로드를 시작할 수 있게 합니다.
    # runtime 범위는 0-1000이며 범위를 벗어나면 경계값으로 보정합니다.
    min-px: 200
  # 자동 최신 메시지 따라가기에서 아직 bottom을 따라가는 상태로 판단할 하단
  # 거리(px)입니다.
  # runtime 범위는 2-300이며 범위를 벗어나면 경계값으로 보정합니다.
  auto-follow-bottom-threshold-px: 80
  # 사용자가 직접 스크롤한 뒤 자동 scroll/follow 처리를 다시 허용하기까지의 idle
  # 시간(ms)입니다.
  # runtime 범위는 50-1000이며 범위를 벗어나면 경계값으로 보정합니다.
  scroll-interaction-idle-ms: 160
  resume-refresh:
    # background/suspend된 페이지가 다시 활성화될 때 interval/unchanged guard에 따라 관련
    # 채팅/config 상태를 refresh합니다.
    enabled: true
    # 자동 resume-refresh 실행 사이의 최소 간격(초)입니다.
    # runtime 범위는 1-300이며 범위를 벗어나면 경계값으로 보정합니다.
    min-interval-seconds: 5
    # 서버측 상태 marker상 관련 데이터가 변하지 않았으면 비용이 큰 resume-refresh 작업을
    # 건너뜁니다.
    skip-unchanged: true
notifications:
  # KWC 페이지가 열려 있을 때 browser notification 생성 기능의 마스터 스위치입니다.
  # 개별 알림 종류와 사용자 preference가 추가로 전달 범위를 줄일 수 있습니다.
  enabled: true
  # 페이지 내 browser notification을 tab/window가 숨김·최소화·비활성일 때만 보내도록
  # 제한합니다.
  # background Web Push에는 적용되지 않습니다.
  only-when-hidden: true
  # 일반 공개 채팅 메시지의 browser notification을 허용합니다.
  notify-normal-chat: true
  # 새 DM의 browser notification을 허용합니다.
  notify-dm: true
  # 새 그룹 방 메시지의 browser notification을 허용합니다.
  notify-group-chat: true
  # KWC mention 판정으로 현재 사용자가 언급됐을 때 browser notification을 허용합니다.
  notify-mentions: true
  # 현재 사용자의 관련 메시지/대화에 Reply가 달렸을 때 browser notification을 허용합니다.
  notify-replies: true
  # 서버/system announcement 알림을 허용합니다.
  # 지원되는 경우 사용자 설정에서 all, join/leave only, off로 더 좁힐 수 있습니다.
  notify-system: true
  # 사용자/관리자 keyword 알림 규칙에 의해 발생하는 browser notification을 허용합니다.
  notify-keywords: true
  # 허용되는 browser notification에 제목/종류만이 아니라 안전한 메시지 text preview를
  # 포함합니다.
  show-message-preview: true
web-push:
  # Web Push subscription 생성에 사용할 VAPID public key입니다.
  # 빈 값이면 Web Push가 필요할 때 KWC가 key pair를 생성/관리합니다.
  vapid-public-key: ""
  # web-push.vapid-public-key와 짝을 이루는 VAPID private key입니다.
  # 비밀로 보관해야 하며 빈 값이면 필요할 때 KWC가 pair를 생성/관리합니다.
  vapid-private-key: ""
  # Web Push 인증에 포함할 VAPID contact subject이며 일반적으로 mailto: 또는 https: 관리자 연락
  # URI를 사용합니다.
  subject: "mailto:admin@example.com"
  # server/test/background Web Push notification의 기본 제목입니다.
  # 빈 값이면 frontend.standalone.app-name을 사용합니다.
  notification-title: ""
  # KWC가 관리하는 browser Web Push subscription endpoint/key를 저장하는 JSONL 데이터 파일입니다.
  # 공개 웹 자산이 아니라 application data로 취급합니다.
  subscriptions-file: "web-push-subscriptions.jsonl"
  # push service에 queued Web Push 전달용으로 지정할 time-to-live(초)입니다.
  # runtime 범위는 30-86400이며 범위를 벗어나면 경계값으로 보정합니다.
  ttl-seconds: 300
web-fonts:
  # web-fonts.items와 지정 font directory의 서버 호스팅 웹 폰트 정의를 켭니다.
  enabled: false
  # 설정한 web-font item이 참조하는 폰트 파일을 둘 data directory 기준 상대 폴더입니다.
  directory: "fonts"
  # font-family metadata와 서버 호스팅 파일을 연결하는 웹 폰트 정의 목록입니다.
  # 빈 목록이면 추가 서버 폰트를 등록하지 않습니다.
  # 항목 필드: family(필수 CSS font-family 이름), file(필수, web-fonts.directory 기준 상대 경로;
  # woff2|woff|ttf|otf만 허용), weight(100-900, 기본 400), style(normal|italic|oblique, 기본 normal).
  # 절대 경로, ".."가 포함된 경로, 허용되지 않은 확장자, family/file이 빠진 항목은
  # 무시됩니다. 잘못된 weight/style은 400/normal로 보정됩니다.
  # 예:
  # items:
  #   - family: "Pretendard"
  #     file: "Pretendard.woff2"
  #     weight: 400
  #     style: "normal"
  items: []

# =============================================================================
# 외부 연동
# =============================================================================

discordsrv:
  # DiscordSRV 설정 예시:
  # - DiscordSRV를 별도로 설치/설정한 뒤 channel에는 DiscordSRV Channels mapping의 논리 이름(보통
  #   "global")을 넣습니다.
  # - DiscordSRV가 이미 일반 Minecraft 채팅을 Discord로 보내고 있으면 game-relay-mode: "discordsrv"를
  #   유지해 KWC 중복 전송을 막습니다.
  # - KWC가 Minecraft -> Discord 전송을 직접 담당할 때만 game-relay-mode: "kwc"를 사용하고
  #   DiscordSRV의 경쟁 채팅 relay는 끄십시오.
  # - 다른 서버에서 Relay로 받은 공개채팅은 다시 Discord로 재전송하지 않아 서버/source prefix
  #   중복과 bridge loop를 막습니다.
  # KWC의 선택적 DiscordSRV bridge 기능을 켭니다.
  # DiscordSRV 자체는 별도로 설치/설정되어 있어야 합니다.
  enabled: false
  # 일반 KWC Discord relay에 사용할 DiscordSRV logical channel 이름입니다.
  channel: "global"
  # 허용된 KWC 웹 공개 채팅 메시지를 Discord로 relay합니다.
  web-to-discord: true
  # Minecraft 공개 채팅을 Discord로 보내는 주체를 정합니다.
  # discordsrv는 DiscordSRV native relay를 KWC가 보강하고, kwc는 game-relay-format으로 KWC가 직접
  # 보냅니다.
  # 잘못된 값은 discordsrv로 fallback하며 두 relay를 동시에 켜 중복 전송하지 않도록 합니다.
  game-relay-mode: "discordsrv"
  # 설정된 DiscordSRV channel의 대상 Discord 메시지를 KWC 웹 공개 채팅으로 게시합니다.
  discord-to-web: true
  # Discord→KWC 채팅 수신 시 bot 작성 메시지를 무시해 bot loop/echo 위험을 줄입니다.
  ignore-bot-messages: true
  # 같은 Minecraft 채팅을 DiscordSRV/native relay 상관관계로 다시 관측했을 때 Discord→web 중복
  # 전달을 억제합니다.
  suppress-game-echo: true
  # DiscordSRV relay 전후에 동일 게임 채팅 echo를 상관/억제할 시간 창(초)입니다.
  suppress-game-echo-seconds: 5
  # web→Discord relay가 켜졌을 때 인증된 웹 사용자의 공개 메시지를 Discord로 보냅니다.
  send-web-user-chat-to-discord: true
  # web→Discord relay가 켜졌을 때 게스트 공개 메시지를 Discord로 보냅니다.
  send-web-guest-chat-to-discord: false
  # web→Discord relay가 켜졌을 때 웹 관리자 공개 메시지를 Discord로 보냅니다.
  send-web-admin-chat-to-discord: true
  # web→Discord 메시지의 인식된 KWC custom-emoji token에 외부에서 접근 가능한 이미지 URL을
  # 추가해 Discord가 이미지를 preview할
  # 수 있게 합니다.
  append-web-emoji-links: true
  # Minecraft→Discord relay에서 Discord 게시물의 원본 emoji-token text를 KWC token→image-link 경로로
  # 처리합니다.
  # 렌더된 Minecraft glyph는 변환 원본으로 사용하지 않습니다.
  append-game-emoji-links: true
  # Discord 메시지 한 건에 추가할 custom-emoji 이미지 URL 최대 개수입니다.
  # emoji.game-link.max-links-per-message와 달리 이 설정의 0은 비활성화 의미입니다.
  # 0은 Discord에 emoji 이미지 URL을 추가하지 않습니다.
  max-emoji-links-per-message: 4
  reply-relay:
    # 지원되는 메시지를 Discord로 relay할 때 새 메시지 text만 보내지 않고 KWC Reply context를
    # 보존/전달합니다.
    enabled: false
    # KWC Reply context를 Discord로 relay할 때 설정/기본 Reply marker/prefix를 추가합니다.
    prefix-enabled: true
    # Discord relay 표현에 Reply 대상 원문의 짧은 preview를 포함합니다.
    preview-enabled: true
    # Discord Reply preview에 포함할 Reply 대상 원문 최대 길이입니다.
    # 0은 미리보기 길이 자르기를 하지 않습니다.
    preview-max-length: 120
  # KWC 웹 발신 relay 메시지의 Discord text 형식입니다.
  # {server}, {server_id}, {sender}, {name}, {role}, {source}, {message}, {channel} 등을 지원하며
  # relay 사용 시 서버 identity가 없는 legacy 형식은 자동 prefix될 수 있습니다.
  web-to-discord-format: "[{server}] [Web] {sender}: {message}"
  # discordsrv.game-relay-mode=kwc에서 KWC가 Minecraft 채팅을 직접 Discord로 보낼 때 사용하는 text
  # 형식입니다.
  game-relay-format: "[{server}] {sender}: {message}"
  # 웹 채팅에 표시할 Discord 발신 메시지의 KWC sender label 형식입니다.
  # placeholder: {sender}.
  discord-to-web-sender-format: "Discord:{sender}"
  # 웹 채팅에 표시할 Discord 발신 메시지의 KWC 본문 형식입니다.
  # placeholder: {message}.
  discord-to-web-message-format: "{message}"
admin-alerts:
  discord:
    # 설정한 DiscordSRV channel을 통한 Discord 관리자 keyword alert 기능을 켭니다.
    enabled: false
    # 관리자 alert에 사용할 DiscordSRV logical channel입니다.
    # 빈 값은 discordsrv.channel을 재사용하며 logical mapping이 없을 때만 raw channel id를 ID-only
    # fallback으로 허용합니다.
    channel: ""
    sources:
      # 로컬 공개 채팅 메시지를 설정한 관리자 alert keyword 대상으로 검사합니다.
      public-chat: true
      # 수신 승인된 서버 간 Relay 공개 채팅 메시지를 관리자 alert keyword 대상으로
      # 검사합니다.
      relay-chat: false
      # 명시적으로 켠 경우 비공개 DM 내용을 관리자 alert keyword 대상으로 검사합니다.
      # private message keyword 검사를 원하지 않으면 끕니다.
      dm: false
      # 명시적으로 켠 경우 그룹 방 메시지를 관리자 alert keyword 대상으로 검사합니다.
      group-chat: false
    # 관리자 alert에 추가할 Discord mention 방식입니다.
    # 지원값: none, here, everyone이며 잘못된 값은 none으로 정규화됩니다.
    mention: "none"
    # 설정한 관리자 alert keyword 매칭을 기본 대소문자 무시 비교 대신 case-sensitive로
    # 수행합니다.
    case-sensitive: false
    # 쉼표/줄바꿈으로 구분한 관리자 alert keyword입니다.
    # 항목은 trim/control 문자 제거 후 case-sensitive 정책에 따라 매칭되고 중복 제거 및 KWC
    # 안전 제한이 적용됩니다.
    keywords: ""

# =============================================================================
# 업로드·미디어·이모지
# =============================================================================

upload:
  # 업로드 운영/보안 가이드:
  # - 파일은 KWC data directory 아래 upload.directory에 저장됩니다.
  #   별도 공개 파일 URL을 의도한 경우가 아니면 public-base-url은 비워 두는 것을 권장합니다.
  # - Guest 업로드는 기본 off입니다. 파일/전체 용량 제한 단위는 MiB이며 0은 해당 설정
  #   quota만 해제합니다.
  # - allowed-extensions는 allow-list지만 KWC는 위험한 실행/웹 확장자를 별도로 계속 차단합니다.
  #   확장자 제한만으로 일반 서버/네트워크 보안을 대신할 수는 없습니다.
  # - retention 정리는 오래된 미참조 업로드만 삭제하며, 보존 중인 메시지/pin이 참조하는
  #   파일은 관련 보존 설정에 따라 유지됩니다.
  # KWC 파일 업로드 endpoint와 composer 업로드 제어의 마스터 스위치입니다.
  enabled: true
  # 로그인하지 않은 게스트의 파일 업로드를 허용합니다.
  # spam/storage abuse 위험 때문에 기본값은 off입니다.
  allow-guest-upload: false
  # 인증된 USER 역할 계정의 파일 업로드를 허용합니다.
  allow-user-upload: true
  # 인증된 MODERATOR 역할 계정의 파일 업로드를 허용합니다.
  allow-moderator-upload: true
  # 인증된 ADMIN 역할 계정의 파일 업로드를 허용합니다.
  allow-admin-upload: true
  # 같은 resolved client IP의 업로드 시도 사이에 요구하는 최소 간격(초)입니다.
  # 0은 이 제한 요소를 끕니다.
  cooldown-seconds: 5
  # resolved client IP 하나에 적용하는 분당 업로드 시도 제한입니다.
  # 0은 이 제한 요소를 끕니다.
  max-uploads-per-minute: 4
  # 업로드 파일 한 개에 허용할 최대 크기(MiB)입니다.
  # 0은 이 크기/용량 제한을 없앱니다.
  max-file-size-mb: 20
  # upload.directory 전체 저장 quota(MiB)입니다.
  # 초과 시 가장 오래된 미참조 업로드부터 제거하며 그래도 공간을 확보하지 못하면 새
  # 업로드를 거부합니다.
  # 0은 이 크기/용량 제한을 없앱니다.
  max-total-size-mb: 0
  # composer 업로드 동작 한 번에 선택/첨부할 최대 파일 수입니다.
  # 0은 개수 제한을 없앱니다.
  max-files-per-message: 3
  # KWC 업로드 파일을 저장할 data directory 기준 상대 폴더입니다.
  directory: "uploads"
  # 저장 파일명 정책입니다.
  # random은 생성 storage name으로 원본명을 숨기고, original은 sanitize한 Unicode 원본명을
  # 보존하며 충돌 시 숫자 suffix를
  # 붙입니다.
  # 잘못된 값은 random으로 정규화됩니다.
  filename-mode: "random"
  # 업로드 파일의 공개 URL base입니다.
  # 빈 값은 활성 KWC 공개 API base + /uploads로 계산하며 API-base path, 직접 upload path, 상대 경로,
  # 전체 URL을 호환
  # 방식으로 정규화합니다.
  public-base-url: ""
  # 보존 중인 메시지/pin에서 더 이상 참조하지 않는 업로드 파일만 이 일수보다 오래됐을
  # 때 삭제합니다.
  # 0은 기간 기반 정리를 끕니다.
  retention-days: 5
  # 허용할 업로드 파일 확장자 목록입니다.
  # 빈 목록은 모든 확장자를 허용하는 것이 아니라 KWC 내장 안전 media 확장자 목록으로
  # fallback합니다.
  allowed-extensions:
    - png
    - jpg
    - jpeg
    - gif
    - webp
    - mp4
    - webm
    - mp3
    - m4a
    - ogg
    - wav
    - flac
  # 브라우저 clipboard에서 붙여넣은 image blob을 KWC composer 업로드 경로로 올릴 수 있게
  # 합니다.
  clipboard-upload-enabled: true
  # clipboard 이미지 업로드 후 동작입니다.
  # insert는 업로드 URL을 현재 composer에 넣고 send는 즉시 전송합니다.
  # 잘못된 값은 insert로 정규화됩니다.
  clipboard-upload-send-mode: "insert"
  # 브라우저가 사용할 수 있는 filename/extension을 제공하지 않은 pasted image blob에 붙일 fallback
  # 확장자입니다.
  clipboard-image-default-extension: "png"
  # 업로드한 이미지 URL/file을 inline 이미지 preview renderer에서 표시할 수 있게 합니다.
  preview-images: true
  # 업로드한 video URL/file을 inline video preview/player renderer에서 표시할 수 있게 합니다.
  preview-videos: true
  # 업로드한 audio URL/file을 inline audio player renderer에서 표시할 수 있게 합니다.
  preview-audio: true
preview:
  # 지원되는 YouTube URL을 인식해 웹 채팅에 YouTube embed를 표시합니다.
  youtube-embed-enabled: true
  # 사용자가 클릭하기 전까지 YouTube embed를 로드하지 않아 자동 third-party 요청/리소스
  # 사용을 줄입니다.
  youtube-click-to-load: true
  # renderer가 deferred loading을 지원하는 inline media preview/player를 사용자 동작 전까지 로드하지
  # 않습니다.
  media-click-to-load: true
  # 지원되는 경우 YouTube privacy-enhanced/no-cookie embed endpoint를 사용합니다.
  youtube-nocookie: true
  # 지원되는 경우 YouTube preview의 펼침/접힘 상태를 사용자/브라우저 기준으로 기억합니다.
  youtube-remember-expanded: true
  # YouTube preview를 명시적으로 열 때 autoplay를 요청합니다.
  # 브라우저 autoplay 정책에 따라 실제 재생은 차단될 수 있습니다.
  youtube-autoplay-on-open: false
  # 한 메시지에서 렌더링할 YouTube embed 최대 개수입니다.
  # 0은 개수 제한을 없앱니다.
  youtube-max-embeds-per-message: 1
  social-embeds:
    # 활성화한 TikTok/X provider 등 YouTube 외 social embed의 마스터 스위치입니다.
    enabled: true
    # 지원되는 social embed를 사용자 클릭 전까지 로드하지 않아 자동 third-party 요청을
    # 줄입니다.
    click-to-load: true
    # 한 메시지에서 렌더링할 지원 social embed 최대 개수입니다.
    # 0은 개수 제한을 없앱니다.
    max-embeds-per-message: 2
    tiktok:
      # social-embed 마스터 스위치 아래에서 TikTok URL 인식/embed 렌더링을 켭니다.
      enabled: false
    x:
      # social-embed 마스터 스위치 아래에서 X/Twitter URL 인식/embed 렌더링을 켭니다.
      enabled: false
      # X/Twitter embed에 요청할 theme입니다: auto, light, dark.
      # 잘못된 값은 auto로 정규화됩니다.
      theme: "auto"
      # provider가 지원하는 X/Twitter embed 설정에서 Do-Not-Track 동작을 요청합니다.
      dnt: true
      # embed API가 지원하는 경우 X/Twitter embed의 첨부 media 숨김을 요청합니다.
      hide-media: false
      # 지원되는 경우 X/Twitter embed에서 주변 thread/conversation context 숨김을 요청합니다.
      hide-thread: true
  # 주로 third-party URL이 만료될 수 있는 첨부파일을 보존하기 위한 KWC 외부 media local cache를
  # 켭니다.
  external-media-cache-enabled: true
  # 대상 Discord CDN attachment URL을 원본 URL이 만료되기 전에 KWC external-media cache로 복사합니다.
  cache-discord-cdn: true
  # 지원되는 외부 media의 cache 복사본을 저장할 data directory 기준 상대 폴더입니다.
  external-media-cache-directory: "uploads/external-media-cache"
  # KWC가 fetch/cache할 외부 media 객체 한 개의 최대 크기(MiB)입니다.
  # 0은 이 크기/용량 제한을 없앱니다.
  external-media-cache-max-size-mb: 20
  # 참조되지 않는 external-media cache 파일을 삭제할 기간 기준 일수입니다.
  # 0은 기간 기반 정리를 끕니다.
  external-media-cache-retention-days: 5
  # 외부 media를 local cache로 내려받을 때의 fetch/connect timeout(초)입니다.
  # runtime 최소값은 1이며 더 작은 값은 최소값으로 보정합니다.
  external-media-cache-timeout-seconds: 6
emoji:
  # 커스텀 이모지 설정 확인용 선택적 사용 예:
  # - emoji.directory 바로 아래에 파일을 넣으면 기본/root 이모지, 하위 폴더에 넣으면 pack이
  #   됩니다. Web Admin 이모지 관리자도 같은 저장소를 사용합니다.
  # - picker는 기본적으로 :pack/name: 토큰을 넣고, root에서 이름이 명확하면 :name: 형태도
  #   사용할 수 있습니다. token-format=legacy는 :emoji:pack/name:을 넣으며 두 형식 모두
  #   파싱됩니다.
  # - 같은 pack 안의 이름 충돌은 안정적인 suffix로 구분하고 다른 pack끼리는 분리됩니다.
  #   GIF 애니메이션은 웹에서 유지됩니다.
  # - game-link.enabled=false는 게임측 이모지 플러그인이 처리하도록 원래 토큰을 보존합니다.
  #   KWC가 웹 이모지를 Minecraft용으로 변환해야 할 때만 켜십시오.
  # - max-file-size-kb는 KiB, max-total-size-mb는 MiB 단위이며 0은 해당 제한을 해제합니다.
  # 서버 관리 KWC custom emoji catalog, 렌더링, 관련 admin/upload API를 켭니다.
  # emoji 파일은 디렉터리 바로 아래 또는 pack으로 사용하는 하위 폴더에 둘 수 있습니다.
  enabled: true
  # emoji 기능을 사용할 수 있을 때 웹 채팅 composer에 custom emoji picker 버튼을 표시합니다.
  show-button: true
  # KWC custom emoji 파일과 pack 하위 디렉터리를 scan/store할 data directory 기준 상대 폴더입니다.
  directory: "emojis"
  # custom emoji 파일의 공개 URL base입니다.
  # 빈 값은 활성 KWC 공개 API base + /emojis로 계산하며 API-base path, emoji path, 상대 경로, 전체
  # URL을 호환 방식으로
  # 정규화합니다.
  public-base-url: ""
  # custom emoji 파일 한 개의 크기 제한(KiB)이며 초과 파일은 사용하는 경로에 따라 관리
  # catalog 처리에서 거부/제외됩니다.
  # 0은 이 크기/용량 제한을 없앱니다.
  max-file-size-kb: 512
  # 관리 emoji 파일 전체 storage/catalog quota(MiB)입니다.
  # quota 초과 업로드를 거부하고 catalog scan도 설정 총량을 넘는 파일을 노출하지 않습니다.
  # 0은 이 크기/용량 제한을 없앱니다.
  max-total-size-mb: 64
  # 관리자 emoji manager에 현재 관리 emoji storage 사용량을 표시합니다.
  show-storage-usage: true
  # 관리자 emoji manager에 설정된 전체 emoji storage 제한을 표시합니다.
  show-storage-limit: true
  # 채팅 메시지 안에서 custom emoji를 렌더링할 표시 크기(px)이며 animated GIF는 브라우저에서
  # 애니메이션을 유지합니다.
  # runtime 범위는 16-1024이며 범위를 벗어나면 경계값으로 보정합니다.
  render-size-px: 32
  # emoji picker 안의 item 표시 크기(px)이며 메시지 렌더 크기는 바꾸지 않습니다.
  # runtime 범위는 24-1024이며 범위를 벗어나면 경계값으로 보정합니다.
  picker-size-px: 44
  # 한 메시지에서 허용할 custom emoji token 최대 개수입니다.
  # token은 canonical pack/name 경로를 포함할 수 있습니다.
  # 0은 개수 제한을 없앱니다.
  message-token-limit: 12
  # 웹 emoji picker가 삽입할 token 형식입니다.
  # short=:pack/name:, legacy=:emoji:pack/name:이며 parser는 둘 다 허용합니다.
  # legacy/prefixed/emoji alias는 legacy로, 그 외 값은 short로 정규화됩니다.
  token-format: "short"
  # 허용할 custom emoji 이미지 확장자 목록입니다.
  # 빈 목록은 임의 파일 허용이 아니라 KWC 내장 지원 이미지 확장자 목록으로
  # fallback합니다.
  allowed-extensions:
    - png
    - jpg
    - jpeg
    - gif
    - webp
  game-link:
    # KWC web→Minecraft custom-emoji 변환을 켭니다.
    # 끄면 game-side emoji plugin이 렌더할 수 있도록 원 token text를 보존하고, 켜면
    # emoji.game-link.mode를 적용합니다.
    enabled: false
    # 활성화 시 web→Minecraft emoji 변환 mode입니다.
    # link=label+짧은 이미지 URL, label=label만, preserve=원 token 유지입니다.
    # preserve/token/original/none은 preserve, label/template/text는 label, 그 외는 link로 정규화됩니다.
    mode: "link"
    # 게임 내 emoji 이미지 short link를 만들 공개 KWC API base입니다.
    # 빈 값은 설정된 adapter/standalone/origin 정보에서 자동 계산하며 HTTPS 리버스
    # 프록시에서는 실제 공개 API URL을 명시하면 모호함을 줄일
    # 수 있습니다.
    public-api-base-url: ""
    # web→game emoji 변환에 사용할 text label 형식입니다.
    # placeholder: {id}, {name}, {pack}.
    # pack identity를 보존해야 하면 {id}를 사용합니다.
    label-format: ":{id}:"
    # link mode에서 게임 메시지 한 건에 추가할 emoji 이미지 링크 최대 개수입니다.
    # 0은 개수 제한을 없앱니다.
    max-links-per-message: 4
    # 같은 emoji 이름이 여러 pack에 있을 때 flat token/name의 충돌을 풀기 위해 우선할
    # pack입니다.
    # 빈 값이면 추가 우선 pack을 적용하지 않습니다.
    default-pack: ""
    # web/game token 호환용 명시적 flat/custom alias→canonical pack/name map입니다.
    # 빈 map이면 추가 alias가 없으며 같은 emoji 이름은 서로 다른 pack에 독립적으로 존재할
    # 수 있습니다.
    # alias key는 wave 같은 일반 이름이나 따옴표로 감싼 :wave: token을 사용할 수 있고, 비교 시
    # 대소문자/NFC/NFKC 변형도 정규화합니다. 대상 id가 현재 emoji catalog에 없으면 그 매핑은
    # 무시됩니다.
    # 명시적 매핑이 자동 flat-name 매칭보다 우선합니다.
    # 예:
    # aliases:
    #   wave: "default/wave"
    #   ":party:": "global/party"
    aliases: {}
