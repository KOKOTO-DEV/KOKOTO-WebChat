# =============================================================================
# 핵심 설정
# =============================================================================

# KOKOTO WebChat 5.1.0
# KWC config-comment-language: ko-KR


# 설정 버전입니다. 이전 버전은 가능한 한 기존 설정값을 보존해 마이그레이션합니다.
# <version>_auto_migration 상태에서는 같은 버전의 템플릿 보완을 계속 적용합니다.
# ui.language 변경 시 설정값은 유지하고 주석/레이아웃 언어만 다시 구성할 수 있습니다.
config-version: "5.1.0"

# 전체 기능 스위치입니다. false여도 /kchat reload는 사용할 수 있습니다.
# 새 설정 파일은 검토 후 활성화할 수 있도록 false로 생성됩니다.
enabled: false

update-check:
  # Modrinth에서 최신 안정판을 확인합니다. 프로젝트 이름 전환 중에는 기존 BlueMap WebChat
  # 목록을 fallback 업데이트 소스로 사용할 수 있습니다.
  enabled: true

# =============================================================================
# 네트워크 및 웹 호스팅
# =============================================================================

http:
  # KWC HTTP 서버의 바인드 주소입니다.
  # 직접 수신할 때는 "0.0.0.0"을 사용하고, 같은 호스트의 HTTPS 리버스 프록시만 외부
  # 진입점이면 "127.0.0.1"을 권장합니다.
  host: "0.0.0.0"
  # KWC HTTP 서버가 내부에서 수신하는 TCP 포트입니다.
  # 리버스 프록시/NAT의 외부 포트와 같을 필요는 없습니다.
  port: 8899
  # KWC HTTP 서버에 등록되는 내부 API 경로 prefix이며 일반적으로 /api입니다.
  # 외부 리버스 프록시 prefix를 여기에 중복해서 넣지 않습니다.
  path-prefix: "/api"
  # 브라우저에 노출되는 리버스 프록시 경로 prefix입니다.
  # 공개 URL 계산에만 사용되고 KWC 내부 HTTP route로 등록되지 않으며, 빈 문자열이면 사이트
  # 루트에 공개합니다.
  public-prefix: "/chat"
  # 교차 Origin API 요청에 허용할 브라우저 Origin입니다.
  # 단순 직접/개인 사용은 "*"를 쓸 수 있지만 HTTPS 프록시에서 credential/cookie를 사용하면
  # 실제 공개 Origin을 지정합니다.
  cors-origin: "*"
  # X-Forwarded-For를 제공하도록 신뢰할 리버스 프록시 IP/CIDR 목록입니다.
  # 빈 목록이면 클라이언트가 보낸 X-Forwarded-For를 무시하고 직접 소켓 주소를 사용해 임의
  # 헤더 위조를 막습니다.
  # [] = 신뢰할 프록시 없음. 클라이언트가 보낸 X-Forwarded-For를 무시하고 직접 소켓 IP를
  # 사용합니다.
  # 예: ["127.0.0.1", "::1", "10.0.0.0/8"]
  # 매처는 "*"도 허용하지만 인터넷에 노출된 서버에서는 사용하지 마십시오.
  # 모든 직접 접속원이 보낸 X-Forwarded-For를 신뢰하게 됩니다.
  # 설정 예시 (trusted-proxies: [] 한 줄을 아래 블록으로 교체):
  # trusted-proxies:
  #   - "127.0.0.1"
  #   - "::1"
  #   - "10.0.0.0/8"
  trusted-proxies: []
  # 소켓 IP, X-Forwarded-For 신뢰 판정, 최종 client IP, 요청 경로를 기록하는 임시 진단
  # 로그입니다.
  # 프록시/IP 판정 문제를 확인할 때만 켜고 평상시에는 끕니다.
  log-client-ip-resolution: false
frontend:
  standalone:
    # 선택적 지도 연동과 별개로 플러그인 HTTP 서버에서 독립형 KWC 채팅/PWA를 제공합니다.
    enabled: true
    # 독립형 페이지를 제공하는 내부 route입니다.
    # 브라우저에 보이는 리버스 프록시 prefix는 http.
    # public-prefix에서 별도로 설정합니다.
    path: "/"
    # 독립형 페이지/PWA의 전체 앱 이름이며 알림 제목 fallback에도 사용됩니다.
    # 홈 화면에 설치한 뒤 바꾸면 PWA를 다시 설치해야 할 수 있습니다.
    app-name: "KOKOTO WebChat"
    # 브라우저/런처에서 이름 표시 공간이 좁을 때 사용하는 PWA 짧은 앱 이름입니다.
    app-short-name: "KWC"
    # 독립형 프런트엔드가 사용할 공개 API base입니다.
    # 빈 값은 현재 Origin과 KWC 공개/내부 prefix에서 자동 계산하며, 절대 경로·상대
    # 경로·전체 URL로 덮어쓸 수 있습니다.
    api-base-url: ""
adapters:
  bluemap:
    # BlueMap에 KWC 프런트엔드를 임베드하는 연동을 켭니다.
    # KWC 독립형 모드를 대체하지 않으며 지도 제품 자체의 채팅 전송 기능을 사용하지
    # 않습니다.
    enabled: false
    # Bukkit에서는 KWC 자산을 BlueMap web root에 복사하고, Fabric/NeoForge BlueMap 연동은
    # BlueMapAPI에서 web root를
    # 얻습니다.
    auto-install: true
    # BlueMap webapp.
    # conf에서 KWC가 표시한 연동 블록만 관리하며, 지도 프런트엔드가 파일을 재생성한 뒤
    # startup/reload 시 블록을 복구할 수 있습니다.
    auto-patch-webapp-conf: true
    # BlueMap 임베디드 프런트엔드만 사용할 KWC 공개 API base입니다.
    # 빈 값은 활성 공개 API base를 자동 계산하며, 외부 NAT 포트나 API 호스트가 다르면 실제
    # 경로/URL을 지정합니다.
    api-base-url: ""
    # BlueMap 웹 프런트엔드의 선택적 파일시스템 root입니다.
    # 지원 어댑터에서 빈 값이면 사이트를 만들지 않고 알려진 설정/일반 경로에서
    # 보수적으로 감지합니다.
    bluemap-web-root: "bluemap/web"
    # Bukkit 파일시스템 연동에서 KWC addon 표시 블록을 넣는 BlueMap webapp.
    # conf 경로입니다.
    # Fabric/NeoForge BlueMapAPI 연동은 이 파일을 수정하지 않습니다.
    bluemap-webapp-conf: "plugins/BlueMap/webapp.conf"
    # BlueMap web root를 기준으로 한 KWC 프런트엔드 자산 디렉터리입니다.
    addon-path: "addons/kokoto-web-chat"
  squaremap:
    # squaremap에 KWC 프런트엔드를 임베드하는 연동을 켭니다.
    # KWC 독립형 모드를 대체하지 않으며 지도 제품 자체의 채팅 전송 기능을 사용하지
    # 않습니다.
    enabled: false
    # 기존 squaremap 웹 디렉터리가 감지될 때만 KWC 자산을 설치하며 squaremap 자체를 새로
    # 만들지 않습니다.
    auto-install: true
    # squaremap index.
    # html에서 KWC가 표시한 연동 블록만 관리하며, 지도 프런트엔드가 파일을 재생성한 뒤
    # startup/reload 시 블록을 복구할 수 있습니다.
    auto-patch-index: true
    # squaremap 임베디드 프런트엔드만 사용할 KWC 공개 API base입니다.
    # 빈 값은 활성 공개 API base를 자동 계산하며, 외부 NAT 포트나 API 호스트가 다르면 실제
    # 경로/URL을 지정합니다.
    api-base-url: ""
    # squaremap 웹 프런트엔드의 선택적 파일시스템 root입니다.
    # 지원 어댑터에서 빈 값이면 사이트를 만들지 않고 알려진 설정/일반 경로에서
    # 보수적으로 감지합니다.
    web-root: ""
    # squaremap web root를 기준으로 한 KWC 프런트엔드 자산 디렉터리입니다.
    addon-path: "kokoto-web-chat"
  dynmap:
    # Dynmap에 KWC 프런트엔드를 임베드하는 연동을 켭니다.
    # KWC 독립형 모드를 대체하지 않으며 지도 제품 자체의 채팅 전송 기능을 사용하지
