    auto-install: true
    # Dynmap index.
    # html에서 KWC가 표시한 연동 블록만 관리하며, 지도 프런트엔드가 파일을 재생성한 뒤
    # startup/reload 시 블록을 복구할 수 있습니다.
    auto-patch-index: true
    # Dynmap 임베디드 프런트엔드만 사용할 KWC 공개 API base입니다.
    # 빈 값은 활성 공개 API base를 자동 계산하며, 외부 NAT 포트나 API 호스트가 다르면 실제
    # 경로/URL을 지정합니다.
    api-base-url: ""
    # Dynmap 웹 프런트엔드의 선택적 파일시스템 root입니다.
    # 지원 어댑터에서 빈 값이면 사이트를 만들지 않고 알려진 설정/일반 경로에서
    # 보수적으로 감지합니다.
    web-root: ""
    # Dynmap web root를 기준으로 한 KWC 프런트엔드 자산 디렉터리입니다.
    addon-path: "kokoto-web-chat"
  pl3xmap:
    # Pl3xMap에 KWC 프런트엔드를 임베드하는 연동을 켭니다.
    # KWC 독립형 모드를 대체하지 않으며 지도 제품 자체의 채팅 전송 기능을 사용하지
    # 않습니다.
    enabled: false
    # 연동이 활성일 때 감지되거나 지정된 Pl3xMap web root에 KWC 프런트엔드 자산을
    # 복사합니다.
    auto-install: true
    # Pl3xMap index.
    # html에서 KWC가 표시한 연동 블록만 관리하며, 지도 프런트엔드가 파일을 재생성한 뒤
    # startup/reload 시 블록을 복구할 수 있습니다.
    auto-patch-index: true
    # Pl3xMap 임베디드 프런트엔드만 사용할 KWC 공개 API base입니다.
