# =============================================================================
# コア設定
# =============================================================================

# KOKOTO WebChat 5.2.0
# KWC config-comment-language: ja-JP


# 設定バージョンです。旧バージョンは可能な限り既存設定値を保持して移行します。
# <version>_auto_migration 中は同一バージョンのテンプレート補完を継続します。
# ui.language 変更時は設定値を保持したままコメント/レイアウト言語だけ再構成できます。
config-version: "5.2.0"

# 全機能のスイッチです。false でも /kchat reload は使用できます。
# 新規設定ファイルは確認後に有効化できるよう false で生成されます。
enabled: false

update-check:
  # Modrinth の最新 stable release を確認します。プロジェクト名移行中は既存 BlueMap WebChat
  # listing を fallback 更新元として使用できます。
  enabled: true

# =============================================================================
# ネットワークと Web ホスティング
# =============================================================================

http:
  # KWC HTTP サーバーのバインドアドレスです。
  # 直接待受する場合は 0.0.0.0、同一ホストの HTTPS
  # リバースプロキシだけを公開入口にする場合は 127.0.0.1 を推奨します。
  host: "0.0.0.0"
  # KWC HTTP サーバーが内部で待受する TCP ポートです。
  # リバースプロキシ/NAT の外部ポートと同じである必要はありません。
  port: 8899
  # KWC HTTP サーバーに登録する内部 API パスプレフィックスで、通常は /api です。
  # 外部リバースプロキシのプレフィックスを重複して入れません。
  path-prefix: "/api"
  # ブラウザー向けリバースプロキシのパスプレフィックスです。
  # 公開 URL の計算に使われ、KWC 内部 HTTP ルートには登録されません。
  # 空文字列ならサイトルートで公開します。
  public-prefix: "/chat"
  # クロス Origin API 要求を許可するブラウザー Origin です。
  # 単純な直接/個人利用では "*" を使えますが、HTTPS プロキシで credential/cookie
  # を使う場合は実際の公開 Origin を指定します。
  cors-origin: "*"
  # X-Forwarded-For を提供してよいリバースプロキシ IP/CIDR 一覧です。
  # 空一覧ではクライアント送信の X-Forwarded-For を無視して直接ソケットアドレスを使い、
  # 任意ヘッダー偽装を防ぎます。
  # [] = 信頼するプロキシなし。クライアント送信の X-Forwarded-For を無視し、直接ソケット
  # IP を使用します。
  # 例: ["127.0.0.1", "::1", "10.0.0.0/8"]
  # マッチャーは "*" も受理しますが、インターネット公開サーバーでは使用しないでくだ
  # さい。すべての直接接続元の X-Forwarded-For を信頼することになります。
  # 設定例（trusted-proxies: [] の1行を次のブロックへ置き換えます）:
  # trusted-proxies:
  #   - "127.0.0.1"
  #   - "::1"
  #   - "10.0.0.0/8"
  trusted-proxies: []
  # ソケット IP、X-Forwarded-For の信頼判定、最終 client IP、
  # 要求パスを記録する一時診断ログです。
  # プロキシ/IP 判定を調べる時だけ有効にし、通常運用では無効にします。
  log-client-ip-resolution: false
frontend:
  standalone:
    # 任意のマップ連携とは別に、プラグイン HTTP サーバーからスタンドアロン KWC
    # チャット/PWA を配信します。
    enabled: true
    # スタンドアロンページを配信する内部ルートです。
    # ブラウザー向けリバースプロキシのプレフィックスは http.public-prefix
    # で別に設定します。
    path: "/"
    # スタンドアロンページ/PWA の正式アプリ名で、通知タイトルの fallback
    # にも使われます。
    # ホーム画面へインストール後に変更すると PWA
    # の再インストールが必要になる場合があります。
    app-name: "KOKOTO WebChat"
    # ブラウザー/ランチャーで表示領域が狭い場合に使う PWA の短縮アプリ名です。
    app-short-name: "KWC"
    # スタンドアロンフロントエンドが使う公開 API base です。
    # 空なら現在の Origin と KWC の公開/内部プレフィックスから自動計算し、
    # 絶対パス・相対パス・完全 URL で上書きできます。
    api-base-url: ""
adapters:
  bluemap:
    # BlueMap に KWC フロントエンドを埋め込む連携を有効にします。
    # KWC スタンドアロンを置き換えず、マップ製品自身のチャット転送も使いません。
    enabled: false
    # Bukkit では KWC 資産を BlueMap web root へコピーし、Fabric/NeoForge の BlueMap 連携は BlueMapAPI
    # から web
    # root を取得します。
    auto-install: true
    # BlueMap webapp.conf 内の KWC マーク付き連携ブロックだけを管理し、
    # マップフロントエンドがファイルを再生成した後も startup/reload で復元できます。
    auto-patch-webapp-conf: true
    # BlueMap 埋め込みフロントエンドだけが使う KWC 公開 API base です。
    # 空なら有効な公開 API base を自動計算し、外部 NAT ポートや API
    # ホストが異なる場合は実際のパス/URL を指定します。
    api-base-url: ""
    # BlueMap Web フロントエンドの任意ファイルシステム root です。
    # 対応アダプターで空の場合はサイトを作らず、
    # 既知の設定/一般パスから保守的に検出します。
    bluemap-web-root: "bluemap/web"
    # Bukkit ファイルシステム連携で KWC addon のマーク付きブロックを入れる BlueMap webapp.conf
    # パスです。
    # Fabric/NeoForge の BlueMapAPI 連携はこのファイルを編集しません。
    bluemap-webapp-conf: "plugins/BlueMap/webapp.conf"
    # BlueMap web root からの KWC フロントエンド資産ディレクトリです。
    addon-path: "addons/kokoto-web-chat"
  squaremap:
    # squaremap に KWC フロントエンドを埋め込む連携を有効にします。
    # KWC スタンドアロンを置き換えず、マップ製品自身のチャット転送も使いません。
    enabled: false
    # 既存の squaremap Web ディレクトリを検出した場合だけ KWC 資産を導入し、squaremap
    # 自体は作成しません。
    auto-install: true
    # squaremap index.html 内の KWC マーク付き連携ブロックだけを管理し、
    # マップフロントエンドがファイルを再生成した後も startup/reload
