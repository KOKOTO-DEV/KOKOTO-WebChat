    api-base-url: ""
    # squaremap Web フロントエンドの任意ファイルシステム root です。
    # 対応アダプターで空の場合はサイトを作らず、
    # 既知の設定/一般パスから保守的に検出します。
    web-root: ""
    # squaremap web root からの KWC フロントエンド資産ディレクトリです。
    addon-path: "kokoto-web-chat"
  dynmap:
    # Dynmap に KWC フロントエンドを埋め込む連携を有効にします。
    # KWC スタンドアロンを置き換えず、マップ製品自身のチャット転送も使いません。
    enabled: false
    # 連携が有効な時、検出または指定した Dynmap web root へ KWC
    # フロントエンド資産をコピーします。
    auto-install: true
    # Dynmap index.html 内の KWC マーク付き連携ブロックだけを管理し、
    # マップフロントエンドがファイルを再生成した後も startup/reload で復元できます。
    auto-patch-index: true
    # Dynmap 埋め込みフロントエンドだけが使う KWC 公開 API base です。
    # 空なら有効な公開 API base を自動計算し、外部 NAT ポートや API
    # ホストが異なる場合は実際のパス/URL を指定します。
    api-base-url: ""
    # Dynmap Web フロントエンドの任意ファイルシステム root です。
    # 対応アダプターで空の場合はサイトを作らず、
    # 既知の設定/一般パスから保守的に検出します。
    web-root: ""
    # Dynmap web root からの KWC フロントエンド資産ディレクトリです。
    addon-path: "kokoto-web-chat"
  pl3xmap:
    # Pl3xMap に KWC フロントエンドを埋め込む連携を有効にします。
    # KWC スタンドアロンを置き換えず、マップ製品自身のチャット転送も使いません。
    enabled: false
    # 連携が有効な時、検出または指定した Pl3xMap web root へ KWC
    # フロントエンド資産をコピーします。
    auto-install: true
    # Pl3xMap index.html 内の KWC マーク付き連携ブロックだけを管理し、
    # マップフロントエンドがファイルを再生成した後も startup/reload で復元できます。
    auto-patch-index: true
    # Pl3xMap 埋め込みフロントエンドだけが使う KWC 公開 API base です。
    # 空なら有効な公開 API base を自動計算し、外部 NAT ポートや API
