    # 連携が有効な時、検出または指定した LiveAtlas web root へ KWC
    # フロントエンド資産をコピーします。
    auto-install: true
    # LiveAtlas index.html 内の KWC マーク付き連携ブロックだけを管理し、
    # マップフロントエンドがファイルを再生成した後も startup/reload
