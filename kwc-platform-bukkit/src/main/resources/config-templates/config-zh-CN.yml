    # 集成启用时，把 KWC 前端资源复制到检测到或指定的 LiveAtlas web root。
    auto-install: true
    # 只维护 LiveAtlas index.html 中由 KWC 标记的集成块；地图前端重新生成文件后，可在
    # startup/reload 时恢复该块。
    auto-patch-index: true
    # 仅供 LiveAtlas 嵌入前端使用的 KWC 公开 API base。
    # 为空时自动解析当前公开 API；若外部 NAT 端口或 API 主机不同，
