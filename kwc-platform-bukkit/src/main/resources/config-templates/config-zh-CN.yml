# =============================================================================
# 核心设置
# =============================================================================

# KOKOTO WebChat 5.2.0
# KWC config-comment-language: zh-CN


# 配置版本。旧版本迁移时会尽量保留现有设置值。
# <version>_auto_migration 状态会继续应用同版本模板补全。
# 修改 ui.language 时可保留设置值，只重新生成注释/布局语言。
config-version: "5.2.0"

# 总开关。false 时仍可使用 /kchat reload，但不会启动 Web/聊天服务。
# 新配置默认生成为 false，便于检查后再启用。
enabled: false

update-check:
  # 检查 Modrinth 最新正式版本。项目名称迁移期间可使用现有 BlueMap WebChat listing
  # 作为 fallback 更新来源。
  enabled: true

# =============================================================================
# 网络与 Web 托管
# =============================================================================

http:
  # KWC HTTP 服务绑定地址。
  # 直接监听时可用 0.0.0.0；若同主机 HTTPS 反向代理是唯一公网入口，建议使用 127.0.0.1。
  host: "0.0.0.0"
  # KWC HTTP 服务内部监听的 TCP 端口，不必与反向代理/NAT 的外部端口相同。
  port: 8899
  # KWC HTTP 服务注册的内部 API 路径前缀，通常为 /api。
  # 不要在这里重复外部反向代理前缀。
  path-prefix: "/api"
  # 浏览器可见的反向代理路径前缀。
  # 它只用于计算公开 URL，不会注册为 KWC 内部 HTTP 路由；
  # 空字符串表示发布在站点根路径。
  public-prefix: "/chat"
  # 跨 Origin API 请求允许的浏览器 Origin。
  # 简单直连/个人使用可用 "*"；通过 HTTPS 代理使用 credential/cookie 时，应填写实际公开
  # Origin。
  cors-origin: "*"
  # 允许提供 X-Forwarded-For 的可信反向代理 IP/CIDR 列表。
  # 空列表会忽略客户端自行发送的 X-Forwarded-For，并使用直接套接字地址，
  # 防止任意伪造该头。
  # [] = 不信任任何代理；忽略客户端提供的 X-Forwarded-For，使用直接套接字 IP。
  # 示例：["127.0.0.1", "::1", "10.0.0.0/8"]
  # 匹配器也接受 "*"，但不要在面向互联网的服务器上使用；这会信任所有直接来源提供的
  # X-Forwarded-For。
  # 配置示例（把 trusted-proxies: [] 这一行替换为下面的块）:
  # trusted-proxies:
  #   - "127.0.0.1"
  #   - "::1"
  #   - "10.0.0.0/8"
  trusted-proxies: []
  # 临时诊断日志，记录套接字 IP、X-Forwarded-For 信任判定、最终 client IP 和请求路径。
  # 仅在排查代理/IP 解析时开启，正常运行时应关闭。
  log-client-ip-resolution: false
frontend:
  standalone:
    # 除可选地图集成外，还由插件 HTTP 服务提供独立 KWC 聊天/PWA。
    enabled: true
    # 独立页面的内部服务路由。
    # 浏览器可见的反向代理前缀由 http.public-prefix 单独设置。
    path: "/"
    # 独立页面/PWA 的完整应用名称，也作为通知标题的回退值。
    # 添加到主屏幕后再更改，可能需要重新安装 PWA。
    app-name: "KOKOTO WebChat"
    # 浏览器/启动器标签空间有限时使用的 PWA 短名称。
    app-short-name: "KWC"
    # 独立前端使用的公开 API base。
    # 为空时根据当前 Origin 与 KWC 公开/内部前缀自动计算，也可用绝对路径、
    # 相对路径或完整 URL 覆盖。
    api-base-url: ""
adapters:
  bluemap:
    # 启用把 KWC 前端嵌入 BlueMap 的集成。
    # 它不会替代 KWC 独立模式，也不使用地图产品自身的聊天传输。
    enabled: false
    # Bukkit 会把 KWC 资源复制到 BlueMap web root；Fabric/NeoForge 的 BlueMap 集成通过 BlueMapAPI 获取
    # web root。
    auto-install: true
    # 只维护 BlueMap webapp.conf 中由 KWC 标记的集成块；地图前端重新生成文件后，可在
    # startup/reload 时恢复该块。
    auto-patch-webapp-conf: true
    # 仅供 BlueMap 嵌入前端使用的 KWC 公开 API base。
    # 为空时自动解析当前公开 API；若外部 NAT 端口或 API 主机不同，
    # 应明确填写实际路径/URL。
    api-base-url: ""
    # BlueMap Web 前端的可选文件系统根目录。
    # 支持的适配器在为空时不会创建站点，而是从已知配置/常用路径谨慎检测。
    bluemap-web-root: "bluemap/web"
    # Bukkit 文件系统集成中用于写入 KWC addon 标记块的 BlueMap webapp.conf 路径。
    # Fabric/NeoForge 的 BlueMapAPI 集成不会修改此文件。
    bluemap-webapp-conf: "plugins/BlueMap/webapp.conf"
    # 相对于 BlueMap web root 的 KWC 前端资源目录。
    addon-path: "addons/kokoto-web-chat"
  squaremap:
    # 启用把 KWC 前端嵌入 squaremap 的集成。
    # 它不会替代 KWC 独立模式，也不使用地图产品自身的聊天传输。
    enabled: false
    # 仅在检测到现有 squaremap Web 目录时安装 KWC 资源，不会创建 squaremap 本身。
    auto-install: true
    # 只维护 squaremap index.html 中由 KWC 标记的集成块；地图前端重新生成文件后，可在
    # startup/reload 时恢复该块。
    auto-patch-index: true
    # 仅供 squaremap 嵌入前端使用的 KWC 公开 API base。
    # 为空时自动解析当前公开 API；若外部 NAT 端口或 API 主机不同，
    # 应明确填写实际路径/URL。
    api-base-url: ""
    # squaremap Web 前端的可选文件系统根目录。
    # 支持的适配器在为空时不会创建站点，而是从已知配置/常用路径谨慎检测。
    web-root: ""
    # 相对于 squaremap web root 的 KWC 前端资源目录。
    addon-path: "kokoto-web-chat"
  dynmap:
    # 启用把 KWC 前端嵌入 Dynmap 的集成。
    # 它不会替代 KWC 独立模式，也不使用地图产品自身的聊天传输。
    enabled: false
    # 集成启用时，把 KWC 前端资源复制到检测到或指定的 Dynmap web root。
    auto-install: true
    # 只维护 Dynmap index.html 中由 KWC 标记的集成块；地图前端重新生成文件后，可在
    # startup/reload 时恢复该块。
    auto-patch-index: true
    # 仅供 Dynmap 嵌入前端使用的 KWC 公开 API base。
    # 为空时自动解析当前公开 API；若外部 NAT 端口或 API 主机不同，
    # 应明确填写实际路径/URL。
    api-base-url: ""
    # Dynmap Web 前端的可选文件系统根目录。
    # 支持的适配器在为空时不会创建站点，而是从已知配置/常用路径谨慎检测。
    web-root: ""
    # 相对于 Dynmap web root 的 KWC 前端资源目录。
    addon-path: "kokoto-web-chat"
  pl3xmap:
    # 启用把 KWC 前端嵌入 Pl3xMap 的集成。
    # 它不会替代 KWC 独立模式，也不使用地图产品自身的聊天传输。
    enabled: false
    # 集成启用时，把 KWC 前端资源复制到检测到或指定的 Pl3xMap web root。
    auto-install: true
    # 只维护 Pl3xMap index.html 中由 KWC 标记的集成块；地图前端重新生成文件后，可在
    # startup/reload 时恢复该块。
    auto-patch-index: true
    # 仅供 Pl3xMap 嵌入前端使用的 KWC 公开 API base。
    # 为空时自动解析当前公开 API；若外部 NAT 端口或 API 主机不同，
    # 应明确填写实际路径/URL。
    api-base-url: ""
    # Pl3xMap Web 前端的可选文件系统根目录。
    # 支持的适配器在为空时不会创建站点，而是从已知配置/常用路径谨慎检测。
    web-root: ""
    # 相对于 Pl3xMap web root 的 KWC 前端资源目录。
