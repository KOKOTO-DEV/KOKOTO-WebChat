# Copy these values into plugins/KOKOTO-WebChat/config.yml for the recommended Caddy same-domain HTTPS deployment.
# Replace https://map.example.com with your actual public map URL.

http:
  host: "127.0.0.1"
  port: 8899
  path-prefix: "/api"
  public-prefix: "/chat"
  cors-origin: "https://map.example.com"
  trusted-proxies:
    - "127.0.0.1"
    - "::1"
  log-client-ip-resolution: false

frontend:
  standalone:
    enabled: true
    path: "/"
    # With the Caddy route below, open https://map.example.com/chat.
    api-base-url: ""

adapters:
  bluemap:
    enabled: true
    # Empty = use http.public-prefix + http.path-prefix on HTTPS.
    api-base-url: ""

upload:
  # Recommended: empty; uploads follow the active public API base + /uploads.
  public-base-url: ""

emoji:
  # Recommended: empty; emoji files follow the active public API base + /emojis.
  public-base-url: ""
