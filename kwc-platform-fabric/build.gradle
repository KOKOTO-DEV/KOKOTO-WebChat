// KWC 파일 안내 / KWC file guide
// 이 Gradle 파일은 kwc-platform-fabric/build.gradle 빌드의 plugin/toolchain/dependency/산출물 이름을 정의한다.
// This Gradle file defines plugins, toolchains, dependencies, and artifact naming for kwc-platform-fabric/build.gradle.
// exact-target JDK/loader pin은 릴리스 호환성 계약이므로 버전 변경 시 build-all 스크립트와 validation matrix를 함께 확인한다.
// Exact-target JDK/loader pins are release compatibility contracts; update build-all scripts and validation matrices together when versions change.

plugins { id 'base' }

def targets=['1.18.2','1.19.2','1.19.4','1.20.1','1.20.2','1.20.4','1.20.6','1.21.1','1.21.3','1.21.4','1.21.5','1.21.8','1.21.10','1.21.11','26.1.2','26.2']
tasks.register('targetMatrix') { doLast { targets.each { println it } } }
