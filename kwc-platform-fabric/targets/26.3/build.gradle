// KWC 파일 안내 / KWC file guide
// Minecraft 26.3 Fabric 정식 지원 전에 소스 호환성과 exact pin을 검증하기 위한 비활성 준비 빌드다.
// Disabled preparation build used to validate source compatibility and exact pins before official Minecraft 26.3 Fabric support.
// 이 파일의 loader/API 값은 gradle.properties에서 읽으며 TBD가 남아 있으면 빌드를 거부한다.
// Loader/API values are read from gradle.properties and the build is rejected while any required pin remains TBD.

plugins { id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT' }

def requiredPin = { String key ->
    def value = providers.gradleProperty(key).orNull?.trim()
    if (!value || value.equalsIgnoreCase('TBD')) {
        throw new GradleException("KWC Fabric 26.3 PREP requires an exact ${key} pin before activation.")
    }
    value
}
def minecraftVersion = providers.gradleProperty('kwc.minecraft').get()
def loaderVersion = requiredPin('kwc.loader')
def fabricApiVersion = requiredPin('kwc.fabric_api')
def targetJava = providers.gradleProperty('kwc.java').get()

group='dev.kokoto.webchat'
version='5.3.1'
base { archivesName='KOKOTO-WebChat-5.3.1-Fabric-26.3' }

repositories { mavenCentral(); maven { url 'https://repo.bluecolored.de/releases' } }
// 26.2의 modern compatibility source set을 우선 재사용하되 정식 26.3 매핑에서 반드시 재컴파일 검증한다.
// Reuse the 26.2 modern compatibility source set provisionally, but recompile it against final 26.3 mappings before support is enabled.
sourceSets.main.java.srcDirs=['../../src/common/java','../../src/compatV2/java','../../src/compatModern/java','../../../kwc-core/src/main/java','../../../kwc-adapter-bluemap/src/main/java','../../../kwc-adapter-squaremap/src/main/java','../../../kwc-adapter-dynmap/src/main/java','../../../kwc-adapter-pl3xmap/src/main/java','../../../kwc-adapter-liveatlas/src/main/java','../../../kwc-adapter-unmined/src/main/java','../../../kwc-adapter-overviewer/src/main/java','../../../kwc-adapter-bluemap-api/src/main/java']
sourceSets.main.resources.srcDirs=['../../../kwc-standalone-frontend/src/main/resources','../../../kwc-adapter-bluemap/src/main/resources','../../../kwc-adapter-squaremap/src/main/resources','../../../kwc-adapter-dynmap/src/main/resources','../../../kwc-adapter-pl3xmap/src/main/resources','../../../kwc-adapter-liveatlas/src/main/resources','../../../kwc-adapter-unmined/src/main/resources','../../../kwc-adapter-overviewer/src/main/resources']

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${loaderVersion}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    implementation include('org.xerial:sqlite-jdbc:3.53.2.0')
    implementation include('org.yaml:snakeyaml:2.4')
    compileOnly 'de.bluecolored:bluemap-api:2.8.0'
}

def metadata=tasks.register('generateModMetadata',Copy) {
    from('../../src/common/templates')
    into(layout.buildDirectory.dir('generated/resources'))
    expand(version:'5.3.1',minecraft_version:minecraftVersion,loader_version:loaderVersion,java_version:targetJava)
}
tasks.named('processResources').configure { dependsOn(metadata); from(layout.buildDirectory.dir('generated/resources')); from('../../../kwc-platform-bukkit/src/main/resources') { include 'config.yml'; include 'config-baselines/**'; include 'config-templates/**'; include 'lang/**'; include 'filter-lists-default/**' } }

tasks.withType(JavaCompile).configureEach { options.release=Integer.parseInt(targetJava); options.encoding='UTF-8' }
java { sourceCompatibility=JavaVersion.toVersion(targetJava); targetCompatibility=JavaVersion.toVersion(targetJava); withSourcesJar() }
tasks.withType(AbstractArchiveTask).configureEach { archiveBaseName.set('KOKOTO-WebChat-5.3.1-Fabric-26.3'); archiveVersion.set('') }
jar { from('../../../LICENSE') { rename { 'LICENSE_KOKOTO-WebChat' } } }
